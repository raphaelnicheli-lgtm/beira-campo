function fill(t, o) { return t.replace("%P", o.p || "").replace("%A", o.a || "").replace("%C", o.c || "").replace("%T", o.t || ""); }

/* ---------- escolha de jogadores em lance ---------- */
function sorteia(lista, pesoFn) {
  let tot = 0; const ws = lista.map(x => { const w = Math.max(.01, pesoFn(x)); tot += w; return w; });
  let r = Math.random() * tot;
  for (let i = 0; i < lista.length; i++) { r -= ws[i]; if (r <= 0) return lista[i]; }
  return lista[lista.length - 1];
}
const PESO_GOL = { ATA: 34, PON: 22, MEI: 15, VOL: 7, LAT: 6, ZAG: 8, GOL: 0 };
const PESO_ASS = { ATA: 12, PON: 26, MEI: 28, VOL: 14, LAT: 16, ZAG: 3, GOL: 1 };

/* ============================================================
   simulação de partida (ao vivo, com pausas de decisão)
   ============================================================ */
function novaPartida(hId, aId, tatH, tatA, xiH, xiA, bancoH, bancoA) {
  const bl = () => ({ fin: 0, alvo: 0, esc: 0, faltas: 0, ca: 0, cv: 0, posse: 0 });
  const st = {
    h: hId, a: aId, gh: 0, ga: 0, ev: [], min: 0, fim: false,
    extra1: Ri(1, 3), extra2: Ri(2, 5),
    intervalo: false, intervaloFeito: false, vestiario: null,
    pausa: null, autoResolve: false, humano: null, decisoes: true,
    xi: { [hId]: xiH.slice(), [aId]: xiA.slice() },
    tat: { [hId]: Object.assign({}, tatH), [aId]: Object.assign({}, tatA) },
    stats: { [hId]: bl(), [aId]: bl() },
    nota: {}, marcadores: [], cards: {}, lesoes: [], leve: {},
    red: { [hId]: 0, [aId]: 0 }, subs: { [hId]: 0, [aId]: 0 },
    jogaram: new Set(), forca: {}, entrada: {}, condIni: {}, condFinal: null,
    banco: { [hId]: (bancoH || []).slice(), [aId]: (bancoA || []).slice() },
    auto: { [hId]: false, [aId]: false },
    dia: { [hId]: R(.91, 1.09), [aId]: R(.91, 1.09) }
  };
  st.total = 90 + st.extra1 + st.extra2;
  const fim1 = 45 + st.extra1;

  const emCampo = ci => st.xi[ci].map(id => id && byId(id)).filter(Boolean);
  const linha = ci => emCampo(ci).filter(p => p.pos !== "GOL");
  /* minuto "de relógio": ignora os acréscimos do 1º tempo */
  st.realMin = () => st.min <= fim1 ? Math.min(st.min, 45) : st.min - st.extra1;
  st.label = m => {
    if (m <= 45) return m + "'";
    if (m <= fim1) return "45+" + (m - 45) + "'";
    const r = m - st.extra1;
    return r <= 90 ? r + "'" : "90+" + (r - 90) + "'";
  };

  /* condição real de cada jogador em campo, agora */
  st.condAt = () => {
    const map = {};
    for (const ci of [hId, aId]) {
      const taxa = st.tat[ci].press === "alta" ? .46 : st.tat[ci].press === "baixa" ? .24 : .34;
      for (const id of st.xi[ci]) {
        if (!id) continue;
        const p = byId(id); if (!p) continue;
        const desde = st.entrada[id] || 0;
        const base = st.condIni[id] != null ? st.condIni[id] : p.cond;
        const desconto = Math.max(0, st.realMin() - desde) * taxa + (st.leve[id] ? 0 : 0);
        map[id] = clamp(base - desconto + (st.intervaloFeito && desde < 45 ? 4 : 0), 8, 100);
      }
    }
    return map;
  };
  st.recalc = () => {
    const cm = st.condAt();
    st.forca[hId] = forcaTime(hId, st.xi[hId], st.tat[hId], true, cm);
    st.forca[aId] = forcaTime(aId, st.xi[aId], st.tat[aId], false, cm);
    // jogador orientado a "pegar leve" marca menos
    for (const ci of [hId, aId]) {
      const n = st.xi[ci].filter(id => id && st.leve[id]).length;
      if (n) st.forca[ci].def *= 1 - n * .045;
    }
  };
  [hId, aId].forEach(ci => emCampo(ci).forEach(p => {
    st.nota[p.id] = 6 + R(-.35, .35); st.jogaram.add(p.id);
    st.entrada[p.id] = 0; st.condIni[p.id] = p.cond;
  }));
  st.recalc();

  function push(min, ci, cls, txt) { st.ev.push({ m: min, ci, cls, txt, t: st.label(min) }); }
  function gol(min, ci, fin, ass, pen) {
    if (ci === hId) st.gh++; else st.ga++;
    st.stats[ci].alvo++;
    const placar = `${S.clubs[hId].s} ${st.gh}–${st.ga} ${S.clubs[aId].s}`;
    const tpl = pen ? pick(NARR.penGol)
      : (fin.talento === 2 && Math.random() < .6) ? pick(NARR.craque)
      : ass ? pick(NARR.golAssist) : pick(NARR.gol);
    push(min, ci, "gol", fill(tpl, { p: fin.nome, a: ass ? ass.nome : "", c: placar }));
    st.nota[fin.id] = (st.nota[fin.id] || 6) + 1.15;
    if (ass) st.nota[ass.id] = (st.nota[ass.id] || 6) + .65;
    st.marcadores.push({ ci, fin: fin.id, ass: ass ? ass.id : null, m: min });
    st.ultimoGol = { ci, min, nome: fin.nome, placar };
  }

  /* ---------- ações do técnico ---------- */
  st.sub = (ci, outId, inId) => {
    if (st.subs[ci] >= 5) return "Limite de 5 substituições atingido.";
    const ix = st.xi[ci].indexOf(outId);
    const forcado = st.pausa && st.pausa.tipo === "lesao" && st.pausa.id === outId;
    if (ix < 0 && !forcado) return "Esse jogador não está em campo.";
    const dentro = byId(inId);
    if (!dentro) return "Jogador indisponível.";
    if (st.jogaram.has(inId)) return "Esse jogador já entrou em campo.";
    const alvo = ix >= 0 ? ix : st.xi[ci].indexOf(null);
    if (alvo < 0) return "Não há vaga em campo.";
    st.xi[ci][alvo] = inId;
    st.subs[ci]++;
    st.jogaram.add(inId);
    st.nota[inId] = 6 + R(-.2, .3);
    st.entrada[inId] = st.realMin();
    st.condIni[inId] = dentro.cond;
    const saiu = outId ? byId(outId) : null;
    push(st.min, ci, "sub", `Substituição no ${S.clubs[ci].n}: ${saiu ? "sai " + saiu.nome + ", " : ""}entra ${dentro.nome}.`);
    st.recalc();
    return null;
  };
  st.ajustar = (ci, campo, valor) => { st.tat[ci][campo] = valor; st.recalc(); };

  st.cobrarPenalti = idBatedor => {
    const pa = st.pausa; if (!pa || pa.tipo !== "penalti") return;
    const bat = byId(idBatedor) || byId(pa.cands[0]);
    st.stats[pa.ci].fin++;
    const chance = clamp(.62 + bat.fin / 320 + (bat.pos === "ATA" || bat.pos === "MEI" ? .05 : 0), .55, .90);
    if (Math.random() < chance) gol(st.min, pa.ci, bat, null, true);
    else { push(st.min, pa.ci, "", fill(pick(NARR.penPerd), { p: bat.nome })); st.nota[bat.id] -= .9; }
    st.pausa = null;
  };
  st.decidirAmarelo = (escolha, subIn) => {
    const pa = st.pausa; if (!pa || pa.tipo !== "amarelo") return null;
    const p = byId(pa.id);
    if (escolha === "sair") {
      const err = st.sub(pa.ci, pa.id, subIn);
      if (err) return err;
    } else if (escolha === "leve") {
      st.leve[pa.id] = true;
      push(st.min, pa.ci, "", `Orientação do banco: ${p.nome} entra menos na dividida.`);
      st.recalc();
    }
    st.pausa = null; return null;
  };
  st.decidirLesao = (escolha, subIn) => {
    const pa = st.pausa; if (!pa || pa.tipo !== "lesao") return null;
    const p = byId(pa.id);
    if (escolha === "arriscar" && !pa.grave) {
      st.condIni[pa.id] = clamp((st.condIni[pa.id] != null ? st.condIni[pa.id] : p.cond) - 18, 8, 100);
      st.risco = st.risco || {}; st.risco[pa.id] = true;
      push(st.min, pa.ci, "", `${p.nome} pede pra continuar. Segue em campo, mas visivelmente limitado.`);
      st.recalc(); st.pausa = null; return null;
    }
    const err = st.sub(pa.ci, pa.id, subIn);
    if (err) {           // sem banco ou sem substituições: sai e o time fica com menos
      const ix = st.xi[pa.ci].indexOf(pa.id);
      if (ix >= 0) st.xi[pa.ci][ix] = null;
      push(st.min, pa.ci, "red", `${p.nome} deixa o campo. ${S.clubs[pa.ci].n} segue com um a menos.`);
      st.recalc();
    }
    st.lesoes.push({ id: pa.id, jogos: pa.grave ? Ri(3, 8) : Ri(1, 4) });
    st.pausa = null; return null;
  };
  st.discurso = escolha => {
    if (st.vestiario) return;
    const ci = st.humano; if (ci == null) { st.vestiario = escolha; return; }
    const meuGols = ci === hId ? st.gh : st.ga, deles = ci === hId ? st.ga : st.gh;
    const situacao = meuGols > deles ? "ganhando" : meuGols < deles ? "perdendo" : "empatando";
    let d = 0, txt = "";
    if (escolha === "elogiar") {
      d = situacao === "ganhando" ? 7 : situacao === "empatando" ? 1 : -4;
      txt = "Você elogia a entrega do grupo.";
    } else if (escolha === "cobrar") {
      d = situacao === "perdendo" ? 8 : situacao === "empatando" ? 4 : -6;
      txt = "Você sobe o tom e cobra atitude.";
    } else {
      d = 3; txt = "Você mantém a calma e reforça o plano de jogo.";
    }
    for (const p of emCampo(ci)) { p.moral = clamp(p.moral + d, 5, 100); st.nota[p.id] += d * .02; }
    st.ev.push({ m: st.min, ci, cls: "big", t: "INT", txt: `${txt} ${d > 0 ? "O time volta ligado." : "O vestiário não gostou."}` });
    st.vestiario = { escolha, delta: d };
    st.recalc();
  };
  st.voltarSegundoTempo = () => { st.intervalo = false; };

  /* ---------- resolução automática (IA / pular jogo) ---------- */
  st.resolverAuto = () => {
    const pa = st.pausa;
    if (pa) {
      if (pa.tipo === "penalti") {
        const cands = pa.cands.map(byId).filter(Boolean).sort((x, y) => y.fin - x.fin);
        st.cobrarPenalti(cands.length ? cands[0].id : null);
      } else if (pa.tipo === "amarelo") {
        st.decidirAmarelo("nada");
      } else if (pa.tipo === "lesao") {
        const banco = st.banco[pa.ci].map(byId).filter(p => p && p.lesao === 0 && !st.jogaram.has(p.id));
        const p = byId(pa.id);
        const entra = banco.sort((x, y) => y.ovr - x.ovr).find(q => AFF[q.pos][p.pos] > .7) || banco[0];
        if (!pa.grave && !entra) st.decidirLesao("arriscar");
        else st.decidirLesao("sair", entra ? entra.id : null);
      }
      st.pausa = null;
    }
    if (st.intervalo) {
      if (!st.vestiario && st.humano != null) st.discurso("calma");
      st.intervalo = false;
    }
  };

  /* ---------- um minuto ---------- */
  st.step = () => {
    if (st.pausa || st.intervalo) { if (st.autoResolve) st.resolverAuto(); else return []; }
    if (st.min >= st.total) { st.fim = true; return []; }
    st.min++;
    const m = st.min, antes = st.ev.length, real = st.realMin();
    const fH = st.forca[hId], fA = st.forca[aId];
    const possH = clamp(.5 + (fH.mid - fA.mid) / 260, .28, .72);
    st.stats[hId].posse += possH; st.stats[aId].posse += 1 - possH;
    const mAtt = ci => 1 - st.red[ci] * .16, mDef = ci => 1 - st.red[ci] * .13;
    const rate = (f, o, poss, ci, oi) => .105 * clamp(Math.pow((f.att * mAtt(ci) * st.dia[ci]) / (o.def * mDef(oi) * .78 + o.gk * .22), 1.35), .45, 1.95) * (poss * 2);
    const conv = (f, o) => clamp(.078 * Math.pow(f.att / o.gk, .9), .03, .19);

    for (const [ci, oi, ff, oo, poss] of [[hId, aId, fH, fA, possH], [aId, hId, fA, fH, 1 - possH]]) {
      if (st.pausa) break;
      const lin = linha(ci); if (!lin.length) continue;
      const rt = rate(ff, oo, poss, ci, oi);

      if (Math.random() < .0016) {                                    // pênalti
        const vit = sorteia(lin, p => PESO_GOL[p.pos] + 4);
        push(m, ci, "big", fill(pick(NARR.penalti), { p: vit.nome, t: S.clubs[ci].n }));
        const cands = lin.slice().sort((x, y) => y.fin - x.fin).slice(0, 5);
        st.pausa = { tipo: "penalti", ci, cands: cands.map(p => p.id) };
        if (ci !== st.humano || st.autoResolve || !st.decisoes) st.resolverAuto();
        continue;
      }
      if (Math.random() < rt) {                                       // chance
        st.stats[ci].fin++;
        const fin = sorteia(lin, p => PESO_GOL[p.pos] * (p.fin / 55) * (1 + (p.talento || 0) * .20));
        const cv = conv(ff, oo) * (fin.fin / 62) * (1 + (fin.talento || 0) * .09);
        const r = Math.random();
        if (r < cv) {
          const cands = lin.filter(p => p !== fin);
          const ass = Math.random() < .68 && cands.length ? sorteia(cands, p => PESO_ASS[p.pos] * (p.pas / 55) * (1 + (p.talento || 0) * .20)) : null;
          gol(m, ci, fin, ass, false);
        } else if (r < cv + .19) { st.stats[ci].alvo++; push(m, ci, "", fill(pick(NARR.defesa), { p: fin.nome })); st.nota[fin.id] += .12; }
        else if (r < cv + .24) { push(m, ci, "big", fill(pick(NARR.trave), { p: fin.nome })); }
        else { push(m, ci, "", fill(pick(NARR.fora), { p: fin.nome })); st.nota[fin.id] -= .12; }
        continue;
      }
      const q = Math.random();
      if (q < .014) { st.stats[ci].esc++; push(m, ci, "", fill(pick(NARR.perigo), { p: pick(lin).nome })); }
      else if (q < .105) {                                            // falta / cartão
        st.stats[ci].faltas++;
        const f = sorteia(emCampo(ci), p => (p.pos === "ZAG" || p.pos === "VOL" || p.pos === "LAT" ? 3 : 1) * (1 + (70 - p.des) / 90) * (st.leve[p.id] ? .3 : 1));
        const jaTem = st.cards[f.id] === 1;
        if (Math.random() < (jaTem ? .055 : .26)) {
          if (jaTem || Math.random() < .035) {
            st.cards[f.id] = 2; st.stats[ci].cv++; st.red[ci]++;
            push(m, ci, "red", fill(pick(NARR.vermelho), { p: f.nome }));
            st.nota[f.id] -= 1.6;
            const ix = st.xi[ci].indexOf(f.id); if (ix >= 0) st.xi[ci][ix] = null;
            st.recalc();
          } else {
            st.cards[f.id] = 1; st.stats[ci].ca++;
            push(m, ci, "", fill(pick(NARR.amarelo), { p: f.nome })); st.nota[f.id] -= .45;
            if (ci === st.humano && st.decisoes && real >= 20 && real < 82 && !st.autoResolve) st.pausa = { tipo: "amarelo", ci, id: f.id };
          }
        }
      } else if (q < .1085) {                                         // lesão
        const l = pick(emCampo(ci));
        if (l && !st.lesoes.some(x => x.id === l.id) && !(st.pausa)) {
          const grave = Math.random() < .45;
          push(m, ci, "big", fill(pick(NARR.lesao), { p: l.nome }));
          st.pausa = { tipo: "lesao", ci, id: l.id, grave };
          if (ci !== st.humano || st.autoResolve || !st.decisoes) st.resolverAuto();
        }
      }
      // agrava quem seguiu machucado em campo
      if (st.risco) for (const id in st.risco) {
        if (st.xi[ci].includes(+id) && Math.random() < .012 && !st.pausa) {
          delete st.risco[id];
          push(m, ci, "big", `${byId(+id).nome} sente de novo e não tem como continuar.`);
          st.pausa = { tipo: "lesao", ci, id: +id, grave: true };
          if (ci !== st.humano || st.autoResolve || !st.decisoes) st.resolverAuto();
        }
      }
    }

    // substituições automáticas dos times comandados pelo computador
    if (!st.pausa && (real === 58 || real === 70 || real === 80)) {
      for (const ci of [hId, aId]) {
        if (!st.auto[ci]) continue;
        const cm = st.condAt();
        const campo = emCampo(ci).filter(p => p.pos !== "GOL").sort((x, y) => (cm[x.id] || 100) - (cm[y.id] || 100));
        const banco = st.banco[ci].map(id => byId(id)).filter(p => p && p.lesao === 0 && !st.jogaram.has(p.id));
        if (!campo.length || !banco.length) continue;
        const sai = campo[0];
        if ((cm[sai.id] || 100) > 62) continue;
        const entra = banco.sort((x, y) => y.ovr - x.ovr).find(p => AFF[p.pos][sai.pos] > .7) || banco[0];
        if (entra.ovr * .93 < sai.ovr * ((cm[sai.id] || 100) / 100)) continue;
        st.sub(ci, sai.id, entra.id);
      }
    }
    if (st.min % 5 === 0) st.recalc();
    if (st.min === fim1 && !st.intervaloFeito) {
      st.intervaloFeito = true;
      push(m, hId, "big", "Fim do primeiro tempo.");
      if (st.humano != null && !st.autoResolve && st.decisoes) st.intervalo = true;
      else st.recalc();
    }
    if (st.min >= st.total) {
      st.fim = true;
      st.condFinal = st.condAt();
      push(m, hId, "big", "Fim de jogo no " + S.clubs[hId].e + ".");
    }
    return st.ev.slice(antes);
  };

  st.rodarTudo = () => {
    st.autoResolve = true;
    let guarda = 0;
    while (!st.fim && guarda++ < 400) st.step();
    st.autoResolve = false;
    if (!st.condFinal) st.condFinal = st.condAt();
    return st;
  };
  return st;
}

/* ---------- aplica resultado ---------- */
function aplicarPartida(st, fx) {
  const { h, a, gh, ga } = st;
  fx.gh = gh; fx.ga = ga;
  const res = ci => gh === ga ? "E" : (ci === h) === (gh > ga) ? "V" : "D";
  for (const ci of [h, a]) {
    const r = res(ci);
    S.clubs[ci].form.push(r); if (S.clubs[ci].form.length > 6) S.clubs[ci].form.shift();
    // notas + fadiga dos que jogaram
    for (const p of squadOf(ci)) {
      const jogou = st.jogaram.has(p.id);
      if (jogou) {
        p.j++;
        let n = clamp((st.nota[p.id] || 6) + (r === "V" ? .28 : r === "D" ? -.28 : 0), 3, 10);
        const sofridos = ci === h ? ga : gh;
        if (p.pos === "GOL" || p.pos === "ZAG") n += sofridos === 0 ? .5 : -sofridos * .17;
        n = clamp(n, 3, 10);
        p.notaSoma += n; p.ultNota = Math.round(n * 10) / 10;
        p.cond = st.condFinal && st.condFinal[p.id] != null
          ? clamp(st.condFinal[p.id] - R(0, 4), 5, 100)
          : clamp(p.cond - R(15, 27), 5, 100);
        p.moral = clamp(p.moral + (r === "V" ? 6 : r === "D" ? -6 : 1) + (n >= 7.5 ? 4 : n <= 5.5 ? -3 : 0), 5, 100);
      } else {
        p.moral = clamp(p.moral - (p.ovr > 72 ? 2.2 : .8), 5, 100);
      }
      if (p.susp > 0) p.susp--;
      if (p.lesao > 0) p.lesao--;
    }
    for (const mk of st.marcadores.filter(x => x.ci === ci)) {
      const g = byId(mk.fin); if (g) g.g++;
      if (mk.ass) { const as = byId(mk.ass); if (as) as.a++; }
    }
  }
  for (const id in st.cards) {
    const p = byId(+id); if (!p) continue;
    if (st.cards[id] === 2) { p.cv++; p.susp = Ri(1, 2); }
    else { p.ca++; p.amarelos++; if (p.amarelos >= 3) { p.amarelos = 0; p.susp = 1; } }
  }
  for (const l of st.lesoes) { const p = byId(l.id); if (p) { p.lesao = l.jogos; p.cond = clamp(p.cond - 25, 5, 100); } }
}

/* ---------- IA: tática dos adversários ---------- */
function taticaIA(ci) {
  const c = S.clubs[ci];
  const forms = Object.keys(FORMATIONS);
  const f = forms[(ci * 7 + S.temporada) % forms.length];
  const m = c.rep >= 4 ? "ofensivo" : c.rep >= 3 ? "equilibrado" : pick(["equilibrado", "cauteloso"]);
  return { form: f, mental: m, press: c.rep >= 4 ? "alta" : "media", ritmo: "normal" };
}

/* ---------- rodada ---------- */
function jogosDaRodada(r, div) { return S.fixtures.filter(f => f.r === r && (div ? f.div === div : true)); }
function meuJogo(r) { return jogosDaRodada(r).find(f => f.h === S.me || f.a === S.me); }

function simularOutros(r, exceto) {
  for (const fx of jogosDaRodada(r)) {
    if (fx === exceto || fx.gh !== null) continue;
    const tH = taticaIA(fx.h), tA = taticaIA(fx.a);
    const bH = bestXI(fx.h, tH.form), bA = bestXI(fx.a, tA.form);
    const st = novaPartida(fx.h, fx.a, tH, tA, bH.xi, bA.xi,
      bH.resto.sort((x, y) => y.ovr - x.ovr).slice(0, 9).map(p => p.id),
      bA.resto.sort((x, y) => y.ovr - x.ovr).slice(0, 9).map(p => p.id));
    st.auto[fx.h] = true; st.auto[fx.a] = true;
    st.rodarTudo();
    aplicarPartida(st, fx);
  }
}

function fecharRodada(st, fx) {
  aplicarPartida(st, fx);
  simularOutros(S.rodada, fx);
  financasRodada(fx);
  cobrarPromessas();
  avisarContratos();
  mercadoIA();
  recuperarTodos();
  aplicarTreino();
  noticiasRodada(fx, st);
  avaliarDiretoria();
  S.rodada++;
  tocarObras();
  if (S.rodada > 38) fimDeTemporada();
  else if ([1, 2, 3, 4, 19, 20, 21, 22].includes(S.rodada)) refreshMercado();
  ofertasRecebidas();
  save();
}

/* ---------- estádio ---------- */
const OBRAS = {
  amp: {
    n: "Ampliação", max: 4, rodadas: 6,
    d: "Novo anel de arquibancada. Mais gente no estádio em todo jogo em casa.",
    ganho: "+18% de capacidade"
  },
  mod: {
    n: "Modernização", max: 3, rodadas: 4,
    d: "Cadeiras, acessos, cobertura e bares. O torcedor paga mais caro e volta mais vezes.",
    ganho: "+14% no ingresso"
  }
};
function capacidadeDe(c) { return Math.round(c.cap * Math.pow(1.18, c.amp || 0)); }
function precoBase(c) { return 44 * Math.pow(1.14, c.mod || 0); }
function atracaoExtra(c) { return (c.mod || 0) * .035; }
function custoObra(c, tipo) {
  if (tipo === "amp") {
    const novas = capacidadeDe(c) * .18;
    return Math.round(novas * 4200 * (1 + (c.amp || 0) * .22) / 100000) * 100000;
  }
  return Math.round(capacidadeDe(c) * 620 * (1 + (c.mod || 0) * .35) / 100000) * 100000;
}
function podeObra(c, tipo) {
  if (c.obra) return "Já existe uma obra em andamento.";
  if ((c[tipo] || 0) >= OBRAS[tipo].max) return "Este estádio já chegou ao limite dessa obra.";
  if (custoObra(c, tipo) > c.saldo) return "Caixa insuficiente para bancar a obra.";
  return null;
}
function iniciarObra(ci, tipo) {
  const c = S.clubs[ci];
  const erro = podeObra(c, tipo);
  if (erro) return { ok: false, m: erro };
  const custo = custoObra(c, tipo);
  c.saldo -= custo;
  c.obra = { tipo, termina: S.rodada + OBRAS[tipo].rodadas, custo };
  if (ci === S.me) msg("Estádio", `${OBRAS[tipo].n} do ${c.e} começou. ${brl(custo, true)} investidos, entrega na rodada ${c.obra.termina}. Durante a obra o público cai um pouco.`, true);
  return { ok: true, m: `Obra iniciada: ${OBRAS[tipo].n} do ${c.e}.` };
}
function tocarObras() {
  for (const c of S.clubs) {
    if (!c.obra) continue;
    if (S.rodada >= c.obra.termina) {
      const t = c.obra.tipo;
      c[t] = (c[t] || 0) + 1;
      c.obra = null;
      if (c.id === S.me) {
        msg("Estádio", t === "amp"
          ? `Obra entregue: ${c.e} passa a receber ${capacidadeDe(c).toLocaleString("pt-BR")} torcedores.`
          : `Reforma entregue: ${c.e} está mais moderno e o ingresso médio subiu.`, true);
      }
    }
  }
  // clubes menores investem quando sobra caixa — é assim que encurtam a distância
  for (const c of S.clubs) {
    if (c.id === S.me || c.obra) continue;
    const tipo = Math.random() < .6 ? "amp" : "mod";
    if ((c[tipo] || 0) >= OBRAS[tipo].max) continue;
    const custo = custoObra(c, tipo);
    const apetite = c.rep <= 3 ? 2.0 : 3.2;
    if (c.saldo > custo * apetite && Math.random() < .06) {
      c.saldo -= custo;
      c.obra = { tipo, termina: S.rodada + OBRAS[tipo].rodadas, custo };
    }
  }
}

/* ---------- finanças ---------- */
function financasRodada(fx) {
  const c = me();
  const emCasa = fx.h === S.me;
  let bilheteria = 0, publico = 0;
  if (emCasa) {
    const adv = S.clubs[fx.a];
    const tab = tabela();
    const minhaPos = tab.findIndex(t => t.id === S.me) + 1;
    const atrat = .30 + c.rep * .055 + adv.rep * .028 + (21 - minhaPos) * .009
      + (c.form.filter(x => x === "V").length * .022) + atracaoExtra(c);
    const capObra = capacidadeDe(c) * (c.obra ? .85 : 1);
    publico = Math.min(Math.round(capObra), Math.round(clamp(atrat, .18, 1) * capObra * R(.9, 1.06)));
    bilheteria = Math.round(publico * precoBase(c) * R(.86, 1.2));
  }
  const patroc = Math.round(c.rep * 520000 * (c.div === 2 ? .5 : 1) * R(.9, 1.1));
  const folha = Math.round(squadOf(S.me).reduce((s, p) => s + p.salario, 0) / 4);
  const custos = Math.round(folha * R(.34, .48));
  const liq = bilheteria + patroc - folha - custos;
  c.saldo += liq;
  S.receitas.unshift({ r: S.rodada, publico, bilheteria, patroc, folha, custos, liq, saldo: c.saldo, cap: capacidadeDe(c), obra: !!c.obra });
  if (S.receitas.length > 40) S.receitas.pop();
  if (c.saldo < 0) msg("Financeiro", `O caixa fechou a rodada negativo em ${brl(-c.saldo, true)}. A diretoria está incomodada.`, true);
}

/* ---------- recuperação semanal (liga inteira) ---------- */
function recuperarTodos() {
  const carga = CARGAS.find(x => x.k === S.treino.carga);
  const bonus = 26 + carga.fit;
  for (const p of S.players) {
    if (p.clube < 0) continue;
    p.cond = clamp(p.cond + (p.clube === S.me ? bonus : 27), 5, 100);
    if (p.clube === S.me) continue;
    // evolução leve das joias adversárias, para a liga não estagnar
    if (p.idade <= 23 && p.pot > p.ovr && Math.random() < .02) {
      const w = OVR_W[p.pos]; const k = Object.keys(w)[0];
      p[k] = Math.round(clamp(p[k] + 1, 20, 96)); p.ovr = ovrOf(p); p.valor = valorDe(p);
    }
    if (p.lesao > 0 && Math.random() < .5) p.lesao = Math.max(0, p.lesao - 0);
  }
}

/* ---------- treino ---------- */
function aplicarTreino() {
  const carga = CARGAS.find(x => x.k === S.treino.carga);
  for (const p of squadOf(S.me)) {
    const foco = focoDe(GRUPO[p.pos]);
    if (foco.k === "regen") p.cond = clamp(p.cond + 11, 5, 100);
    if (p.lesao > 0) continue;
    const risco = foco.k === "regen" ? .35 : 1;
    if (Math.random() < .0055 * carga.risk * risco * (1 + (100 - p.cond) / 90)) {
      p.lesao = Ri(1, 4);
      msg("Departamento médico", `${p.nome} se machucou no treino e desfalca o time por ${p.lesao} jogo(s).`);
      continue;
    }
    const jovem = p.idade <= 23, velho = p.idade >= 31;
    const espaco = p.pot - p.ovr;
    for (const k in foco.g) {
      const ch = (jovem ? .30 : velho ? .05 : .15) * carga.gain * (espaco > 0 ? 1 : .12);
      if (Math.random() < ch) p[k] = Math.round(clamp(p[k] + foco.g[k] * R(.4, 1), 20, 96));
    }
    if (velho && Math.random() < .06) { const k = pick(["vel", "fis"]); p[k] = Math.round(clamp(p[k] - R(.5, 1.6), 20, 96)); }
    const novo = ovrOf(p);
    if (novo > p.ovr) msg("Base & Treino", `${p.nome} evoluiu no ${foco.n.toLowerCase()}: ${p.ovr} → ${novo} de overall.`);
    p.ovr = novo; p.valor = valorDe(p);
  }
}

/* ---------- notícias ---------- */
function noticiasRodada(fx, st) {
  const meuGols = fx.h === S.me ? fx.gh : fx.ga;
  const contra = fx.h === S.me ? fx.ga : fx.gh;
  const adv = S.clubs[fx.h === S.me ? fx.a : fx.h].n;
  const r = meuGols > contra ? "Vitória" : meuGols < contra ? "Derrota" : "Empate";
  msg("Imprensa", `${r} por ${meuGols} a ${contra} ${fx.h === S.me ? "em casa contra o" : "fora, diante do"} ${adv}.`, r === "Vitória");
  const tab = tabela();
  const pos = tab.findIndex(t => t.id === S.me) + 1;
  if (S.rodada % 5 === 0) msg("Imprensa", `Fim da ${S.rodada}ª rodada: o time aparece em ${pos}º lugar, com ${tab[pos - 1].pts} pontos.`);
  const art = artilheiros()[0];
  if (art && art.p.clube === S.me && art.p.g >= 6 && S.rodada % 6 === 0)
    msg("Imprensa", `${art.p.nome} lidera a artilharia do Brasileirão com ${art.p.g} gols.`, true);
}

/* ---------- diretoria ---------- */
function avaliarDiretoria() {
  const tab = tabela();
  const pos = tab.findIndex(t => t.id === S.me) + 1;
  const alvo = S.diretoria.meta.pos, tol = S.diretoria.meta.tol;
  const delta = pos <= alvo ? 2.4 : pos <= alvo + tol ? .8 : -1.2 - (pos - alvo - tol) * .18;
  S.diretoria.confianca = clamp(S.diretoria.confianca + delta, 0, 100);
  if (S.diretoria.confianca <= 0 && !S.fim && S.rodada >= 12) {
    S.fim = true; S.demitido = true; S.desempregado = true;
    S.tecnico.rep = clamp(S.tecnico.rep - 12, 0, 100);
    S.tecnico.historico.unshift({ temporada: S.temporada, clube: S.me, div: minhaDiv(), pos, pts: tab[pos - 1].pts, demitido: true, rep: Math.round(S.tecnico.rep) });
    msg("Diretoria", "Sua passagem pelo clube chegou ao fim. Você está demitido.", true);
    gerarEmpregos(true);
  } else if (S.diretoria.confianca < 22 && S.rodada % 3 === 0) {
    msg("Diretoria", `A ${pos}ª colocação está longe do combinado. A confiança da diretoria caiu para ${Math.round(S.diretoria.confianca)}%.`, true);
  }
}

/* ---------- tabela ---------- */
function tabela(div) {
  const d = div || minhaDiv();
  const ids = S.clubs.filter(c => c.div === d).map(c => c.id);
  const t = {};
  ids.forEach(id => t[id] = { id, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, pts: 0 });
  for (const f of S.fixtures) {
    if (f.div !== d || f.gh === null) continue;
    const H = t[f.h], A = t[f.a]; if (!H || !A) continue;
    H.j++; A.j++; H.gp += f.gh; H.gc += f.ga; A.gp += f.ga; A.gc += f.gh;
    if (f.gh > f.ga) { H.v++; H.pts += 3; A.d++; }
    else if (f.gh < f.ga) { A.v++; A.pts += 3; H.d++; }
    else { H.e++; A.e++; H.pts++; A.pts++; }
  }
  const arr = Object.values(t);
  arr.forEach(x => { x.sg = x.gp - x.gc; x.ap = x.j ? Math.round(x.pts / (x.j * 3) * 100) : 0; });
  return arr.sort((a, b) => b.pts - a.pts || b.v - a.v || b.sg - a.sg || b.gp - a.gp || S.clubs[a.id].n.localeCompare(S.clubs[b.id].n));
}
function minhaPos() { return tabela().findIndex(t => t.id === S.me) + 1; }
function artilheiros(div) {
  const d = div || minhaDiv();
  return S.players.filter(p => p.g > 0 && S.clubs[p.clube] && S.clubs[p.clube].div === d)
    .sort((a, b) => b.g - a.g || b.a - a.a).slice(0, 20).map(p => ({ p }));
}

/* ---------- mercado ---------- */
function refreshMercado() {
  S.mercado = [];
  // quem está sem clube entra no mercado de graça
  for (const p of S.players.filter(x => x.clube === -1)) S.mercado.push({ id: p.id, preco: 0, livre: true });
  const pool = S.players.filter(p => p.clube !== S.me);
  const usados = new Set();
  for (let t = 0; t < 300 && usados.size < 26; t++) {
    const p = pick(pool);
    if (!p || usados.has(p.id)) continue;
    usados.add(p.id);
    S.mercado.push({ id: p.id, preco: Math.round(p.valor * R(1.05, 1.55) * (S.clubs[p.clube] && S.clubs[p.clube].div === 2 ? .82 : 1) / 1000) * 1000 });
  }
  // alguns agentes livres gerados, além dos que ficaram sem contrato
  for (let i = 0; i < 4; i++) {
    const p = makePlayer(pick(POSES), Ri(1, 4));
    p.id = S.nextPid++; p.clube = -1; p.livre = true;
    S.players.push(p);
    S.mercado.push({ id: p.id, preco: 0, livre: true });
  }
  S.mercado.sort((a, b) => byId(b.id).ovr - byId(a.id).ovr);
}
function janelaAberta() { return S.rodada <= 7 || (S.rodada >= 17 && S.rodada <= 25); }

function contratar(entry) {
  const p = byId(entry.id), c = me();
  if (!janelaAberta()) return { ok: false, m: "A janela de transferências está fechada." };
  if (squadOf(S.me).length >= 30) return { ok: false, m: "Elenco cheio (máximo de 30 jogadores). Venda ou rescinda com alguém antes." };
  if (entry.preco > c.saldo) return { ok: false, m: "Saldo insuficiente para essa proposta." };
  const quer = entry.livre
    ? Math.random() < .82
    : Math.random() < clamp(.35 + (c.rep - S.clubs[p.clube].rep) * .18 + (entry.preco / Math.max(p.valor, 1) - 1) * .9 - p.talento * .1 + (p.interesse || 0) / 240, .05, .96);
  if (!quer) {
    if (entry.livre || p.clube < 0) {
      p.esperou = (p.esperou || 0) + 1;
      return { ok: false, m: `${p.nome} preferiu ouvir outras propostas antes de decidir. Tente de novo mais tarde.` };
    }
    // contraproposta: o clube diz por quanto libera
    const contra = Math.round(entry.preco * R(1.14, 1.42) / 1000) * 1000;
    entry.preco = contra; entry.negociado = (entry.negociado || 0) + 1;
    return { ok: false, m: `O ${S.clubs[p.clube].n} recusou e pediu ${brl(contra, true)} por ${p.nome}. O novo valor já está na lista — é só propor de novo.` };
  }
  c.saldo -= entry.preco;
  if (p.clube >= 0) S.clubs[p.clube].saldo += entry.preco;
  p.clube = S.me; p.livre = false; delete p.livreDesde; delete p.esperou;
  p.moral = clamp(p.moral + 12, 5, 100); p.contrato = Ri(2, 4);
  S.mercado = S.mercado.filter(m => m.id !== entry.id);
  msg("Transferências", `${p.nome} (${p.pos}, ${p.ovr}) assinou com o clube por ${entry.preco ? brl(entry.preco, true) : "custo zero"}.`, true);
  return { ok: true, m: `${p.nome} é seu novo reforço.` };
}

function podeSair() {
  return squadOf(S.me).length > 16;
}
function tirarDoElenco(id) {
  S.listados = S.listados.filter(x => x !== id);
  S.ofertas = (S.ofertas || []).filter(o => o.id !== id);
  S.xi = S.xi.map(x => x === id ? null : x);
  S.banco = (S.banco || []).filter(x => x !== id);
}

/* venda negociada (proposta recebida) */
function vender(id, valor, clubeId) {
  const p = byId(id);
  if (!podeSair()) return { ok: false, m: "Elenco no limite mínimo (16 jogadores)." };
  me().saldo += valor;
  const destino = clubeId != null ? S.clubs[clubeId] : pick(S.clubs.filter(c => c.id !== S.me));
  p.clube = destino.id;
  tirarDoElenco(id);
  msg("Transferências", `${p.nome} foi vendido ao ${destino.n} por ${brl(valor, true)}.`, true);
  return { ok: true, m: `${p.nome} deixou o clube por ${brl(valor, true)}.` };
}

/* venda imediata: sai na hora, com deságio */
function venderAgora(id) {
  const p = byId(id);
  if (!podeSair()) return { ok: false, m: "Elenco no limite mínimo (16 jogadores)." };
  const v = Math.round(p.valor * R(.70, .86) / 1000) * 1000;
  const destino = pick(S.clubs.filter(c => c.id !== S.me));
  me().saldo += v;
  p.clube = destino.id;
  tirarDoElenco(id);
  msg("Transferências", `${p.nome} saiu às pressas para o ${destino.n} por ${brl(v, true)} — abaixo do valor de mercado.`, true);
  return { ok: true, m: `${p.nome} vendido por ${brl(v, true)}.` };
}
function precoVendaRapida(p) { return Math.round(p.valor * .78 / 1000) * 1000; }

/* rescisão: paga multa e libera a vaga */
function multaRescisao(p) { return Math.round(p.salario * Math.max(4, (p.contrato || 1) * 9) / 1000) * 1000; }
function rescindir(id) {
  const p = byId(id);
  if (!podeSair()) return { ok: false, m: "Elenco no limite mínimo (16 jogadores)." };
  const multa = multaRescisao(p);
  if (multa > me().saldo) return { ok: false, m: `Sem caixa para a multa de ${brl(multa, true)}.` };
  me().saldo -= multa;
  tirarDoElenco(id);
  S.players = S.players.filter(x => x.id !== id);
  msg("Transferências", `Contrato de ${p.nome} rescindido. Multa de ${brl(multa, true)} paga, uma vaga aberta no elenco.`, true);
  return { ok: true, m: `${p.nome} rescindiu. Multa: ${brl(multa, true)}.` };
}

/* propostas recebidas — agora várias, com prazo e possibilidade de pedir mais */
function ofertasRecebidas() {
  S.ofertas = (S.ofertas || []).filter(o => {
    const p = byId(o.id);
    return p && p.clube === S.me && o.expira >= S.rodada;
  });
  if (!janelaAberta()) return;
  const sq = squadOf(S.me);
  const alvos = sq.filter(p => S.listados.includes(p.id) || p.ovr >= 68 || p.talento > 0);
  if (!alvos.length) return;
  const quantas = S.listados.length ? (Math.random() < .75 ? 1 : 0) : (Math.random() < .3 ? 1 : 0);
  for (let i = 0; i < quantas; i++) {
    const p = pick(alvos);
    if (!p || S.ofertas.some(o => o.id === p.id)) continue;
    const listado = S.listados.includes(p.id);
    const mult = listado ? R(.82, 1.18) : R(1.05, 1.7);
    const cands = S.clubs.filter(c => c.id !== S.me && c.rep >= (p.ovr >= 76 ? 3 : 1));
    const clube = pick(cands);
    const valor = Math.round(p.valor * mult / 1000) * 1000;
    S.ofertas.push({ id: p.id, valor, clube: clube.id, expira: S.rodada + 2, contra: 0 });
    msg("Transferências", `${clube.n} ofereceu ${brl(valor, true)} por ${p.nome}${p.talento ? " (craque do elenco)" : ""}. Decida na aba Transferências.`, true);
  }
}
function pedirMais(id) {
  const o = (S.ofertas || []).find(x => x.id === id);
  if (!o) return { ok: false, m: "Proposta não está mais de pé." };
  if (o.contra) return { ok: false, m: "Você já pediu mais uma vez por esse jogador." };
  const p = byId(id);
  const novo = Math.round(o.valor * R(1.2, 1.35) / 1000) * 1000;
  o.contra = 1;
  const aceita = Math.random() < clamp(1.15 - (novo / Math.max(p.valor, 1)) * .55, .18, .82);
  if (aceita) {
    o.valor = novo; o.expira = S.rodada + 2;
    return { ok: true, m: `O ${S.clubs[o.clube].n} topou: ${brl(novo, true)} por ${p.nome}.` };
  }
  S.ofertas = S.ofertas.filter(x => x.id !== id);
  msg("Transferências", `${S.clubs[o.clube].n} desistiu de ${p.nome} depois da sua contraproposta.`);
  return { ok: false, m: `Eles não subiram e retiraram a proposta por ${p.nome}.` };
}

/* ---------- contratos e renovação ---------- */
function fatorPedido(p) {
  let f = 1.08;
  if (p.talento === 2) f += .30; else if (p.talento === 1) f += .14;
  if (p.idade <= 23 && p.pot > p.ovr + 4) f += .18;
  if (p.idade >= 32) f -= .20;
  if (p.j >= 15 && p.notaSoma / Math.max(p.j, 1) >= 7) f += .12;
  f += (p.negociado || 0) * .07;
  return Math.max(.65, f);
}
function salarioPedido(p) { return Math.round(p.valor * .020 * fatorPedido(p) / 1000) * 1000; }
function anosPedidos(p) { return p.idade <= 24 ? 4 : p.idade <= 29 ? 3 : 2; }
function luvasDe(sal, anos) { return Math.round(sal * anos * 2 / 1000) * 1000; }
function vencendo() { return squadOf(S.me).filter(p => p.contrato <= 1 && !p.dispensar); }

function renovar(id, modo) {
  const p = byId(id); if (!p || p.clube !== S.me) return { ok: false, m: "Jogador indisponível." };
  const anos = anosPedidos(p);
  const pedido = salarioPedido(p);
  const oferta = modo === "pechincha" ? Math.round(pedido * .85 / 1000) * 1000 : pedido;
  const custo = luvasDe(oferta, anos);
  if (custo > me().saldo) return { ok: false, m: `Sem caixa para as luvas de ${brl(custo, true)}.` };
  const chance = modo === "pechincha"
    ? clamp(.55 - (p.talento || 0) * .14 - Math.max(0, p.ovr - 70) * .008 - (p.negociado || 0) * .12, .12, .62)
    : .94;
  if (Math.random() > chance) {
    p.negociado = (p.negociado || 0) + 1;
    p.moral = clamp(p.moral - 6, 5, 100);
    return { ok: false, m: `${p.nome} recusou e ficou incomodado. Agora ele pede ${brl(salarioPedido(p), true)}/mês.` };
  }
  me().saldo -= custo;
  p.salario = oferta; p.contrato = anos; p.moral = clamp(p.moral + 10, 5, 100);
  delete p.negociado; delete p.dispensar;
  msg("Contratos", `${p.nome} renovou por ${anos} ano(s): ${brl(oferta, true)}/mês e ${brl(custo, true)} de luvas.`, true);
  return { ok: true, m: `${p.nome} fica até ${S.temporada + anos}.` };
}
function naoRenovar(id) {
  const p = byId(id); if (!p) return { ok: false, m: "" };
  p.dispensar = !p.dispensar;
  return { ok: true, m: p.dispensar ? `${p.nome} sai de graça no fim da temporada.` : `${p.nome} voltou para a lista de renovação.` };
}
function avisarContratos() {
  if (S.rodada !== 20 && S.rodada !== 30 && S.rodada !== 36) return;
  const v = vencendo();
  if (!v.length) return;
  msg("Contratos", `${v.length} contrato(s) terminam nesta temporada: ${v.slice(0, 4).map(p => p.nome).join(", ")}${v.length > 4 ? " e outros" : ""}. Renove na aba Elenco — quem não renovar sai de graça.`, true);
}

/* clubes da IA aproveitam quem está livre no mercado */
function mercadoIA() {
  const livres = S.players.filter(p => p.clube === -1);
  if (!livres.length) return;
  for (const c of S.clubs) {
    if (c.id === S.me || squadOf(c.id).length >= 26 || Math.random() > .16) continue;
    const alvo = livres.filter(p => p.ovr <= 54 + c.rep * 7).sort((a, b) => b.ovr - a.ovr)[0];
    if (!alvo) continue;
    alvo.clube = c.id; alvo.livre = false; alvo.contrato = Ri(2, 3);
    livres.splice(livres.indexOf(alvo), 1);
  }
}

function destaquesDaTemporada() {
  return squadOf(S.me).filter(p => p.j >= 10)
    .sort((a, b) => (b.notaSoma / b.j + b.g * .12) - (a.notaSoma / a.j + a.g * .12)).slice(0, 3);
}
function elogioPublico(id) {
  const p = byId(id);
  if (!p) return { ok: false, m: "Jogador não encontrado." };
  if (p.elogiadoEm === S.temporada) return { ok: false, m: `Você já destacou ${p.nome} publicamente este ano.` };
  p.elogiadoEm = S.temporada;
  p.moral = clamp(p.moral + 14, 5, 100);
  p.valor = Math.round(p.valor * 1.04 / 1000) * 1000;
  S.tecnico.rep = clamp(S.tecnico.rep + 1, 0, 100);
  msg("Imprensa", `Você dedicou a temporada a ${p.nome} em entrevista coletiva. O vestiário aprovou.`, true);
  return { ok: true, m: `${p.nome} agradeceu o reconhecimento público.` };
}

/* ---------- conversa com o elenco ---------- */
const CONVERSAS = {
  elogiar:  { n: "Elogiar",              d: "Reconhecer a fase. Funciona com quem está indo bem; soa falso com quem está mal." },
  cobrar:   { n: "Cobrar",               d: "Subir o tom. Levanta quem está devendo; ofende quem está carregando o time." },
  promessa: { n: "Prometer titularidade",d: "Moral lá em cima na hora. Se ele não jogar nos próximos 5 jogos, a conta chega dobrada." }
};
function notaMedia(p) { return p.j ? p.notaSoma / p.j : 0; }
function podeConversar(p) { return !p.conversa || S.rodada - p.conversa.rodada >= 5; }
function conversar(id, tipo) {
  const p = byId(id);
  if (!p || p.clube !== S.me) return { ok: false, m: "Esse jogador não é seu." };
  if (!podeConversar(p)) return { ok: false, m: `${p.nome} já teve uma conversa com você há pouco. Espere algumas rodadas.` };
  const n = p.j ? notaMedia(p) : 6.3;
  let d = 0, txt = "";
  if (tipo === "elogiar") {
    d = n >= 6.8 ? 8 : n >= 6.2 ? 4 : -4;
    txt = d > 0 ? `${p.nome} agradeceu o reconhecimento e saiu ligado.` : `${p.nome} achou o elogio fora de hora — ele sabe que não está bem.`;
  } else if (tipo === "cobrar") {
    d = n < 6.2 ? 7 : n < 6.8 ? 2 : -8;
    txt = d > 0 ? `${p.nome} ouviu a cobrança calado e prometeu resposta em campo.` : `${p.nome} não engoliu a cobrança. Ele acha que vem sendo dos melhores.`;
  } else if (tipo === "promessa") {
    d = 12;
    p.promessa = { desde: S.rodada, jBase: p.j };
    txt = `${p.nome} saiu da sala animado: você prometeu que ele é titular.`;
  } else return { ok: false, m: "Conversa inválida." };
  p.moral = clamp(p.moral + d, 5, 100);
  p.conversa = { rodada: S.rodada, tipo, d };
  msg("Vestiário", txt, d > 0);
  return { ok: true, m: `${txt} (moral ${d > 0 ? "+" : ""}${d})` };
}
function cobrarPromessas() {
  for (const p of squadOf(S.me)) {
    if (!p.promessa) continue;
    if (S.rodada - p.promessa.desde < 5) continue;
    const jogou = p.j - p.promessa.jBase;
    if (jogou >= 3) {
      p.moral = clamp(p.moral + 8, 5, 100);
      msg("Vestiário", `${p.nome} jogou o que você prometeu e está satisfeito.`);
    } else {
      p.moral = clamp(p.moral - 20, 5, 100);
      msg("Vestiário", `${p.nome} cobrou a promessa de titularidade que você não cumpriu. Moral no chão.`, true);
    }
    delete p.promessa;
  }
}

/* ---------- sondar jogador de outro clube ---------- */
function podeSondar(p) { return !(p.sondado && p.sondado.temporada === S.temporada); }
function sondar(id) {
  const p = byId(id);
  if (!p) return { ok: false, m: "Jogador não encontrado." };
  if (p.clube === S.me) return { ok: false, m: "Ele já é seu." };
  if (!podeSondar(p)) return { ok: false, m: `Você já falou publicamente sobre ${p.nome} nesta temporada.` };
  p.interesse = clamp((p.interesse || 0) + Ri(16, 30), 0, 100);
  p.sondado = { temporada: S.temporada };
  let reacao = "";
  const entry = S.mercado.find(m => m.id === id);
  if (entry && !entry.livre && Math.random() < .6) {
    entry.preco = Math.round(entry.preco * R(1.08, 1.22) / 1000) * 1000;
    reacao = ` O ${S.clubs[p.clube] ? S.clubs[p.clube].n : "clube dele"} se irritou e pediu ${brl(entry.preco, true)}.`;
  }
  msg("Imprensa", `Você elogiou ${p.nome} em entrevista. O jogador gostou do recado.${reacao}`, true);
  return { ok: true, m: `${p.nome} passou a olhar seu projeto com bons olhos — interesse em ${p.interesse}%.${reacao}` };
}

/* ---------- fim de temporada ---------- */
function fimDeTemporada() {
  const div = minhaDiv();
  const tab = tabela(div);
  const pos = tab.findIndex(t => t.id === S.me) + 1;
  S.fim = true;
  S.campeao = tab[0].id;
  S.posFinal = pos;
  const premio = Math.round((div === 2 ? 13e6 - (pos - 1) * .5e6 : 32e6 - (pos - 1) * 1.35e6) * R(.9, 1.1));
  me().saldo += premio;

  const subiu = div === 2 && pos <= 4;
  const caiu = div === 1 && pos >= 17;
  const tabA = tabela(1), tabB = tabela(2);
  S.desfecho = {
    pos, subiu, caiu, campeao: S.campeao === S.me, div,
    tabela: tab.map(t => ({ id: t.id, pts: t.pts, j: t.j, sg: t.sg })),
    sobem: tabB.slice(0, 4).map(t => t.id),
    caem: tabA.slice(16).map(t => t.id)
  };

  if (S.campeao === S.me) { me().titulos++; S.tecnico.titulos++; msg("Diretoria", `CAMPEÃO ${divInfo(div).n.toUpperCase()} DE ${S.temporada}! A cidade parou.`, true); }
  if (subiu) { S.tecnico.acessos++; msg("Diretoria", `ACESSO! O ${me().n} está de volta à Série A.`, true); }
  if (caiu) msg("Diretoria", `Rebaixamento confirmado. O ${me().n} disputa a Série B em ${S.temporada + 1}.`, true);
  msg("Diretoria", `Temporada encerrada em ${pos}º na ${divInfo(div).n}. Premiação de ${brl(premio, true)} creditada.`, true);

  // reputação do técnico
  const bateu = pos <= S.diretoria.meta.pos + S.diretoria.meta.tol;
  let dr = 0;
  if (S.campeao === S.me) dr += div === 1 ? 22 : 12;
  if (subiu) dr += 14;
  if (caiu) dr -= 18;
  dr += bateu ? 7 : -9;
  dr += Math.round((21 - pos) * (div === 1 ? .55 : .3));
  S.tecnico.rep = clamp(S.tecnico.rep + dr, 0, 100);
  S.tecnico.historico.unshift({
    temporada: S.temporada, clube: S.me, div, pos, pts: tab[pos - 1].pts,
    campeao: S.campeao === S.me, subiu, caiu, rep: Math.round(S.tecnico.rep)
  });

  msg("Imprensa", bateu
    ? `Campanha aprovada. Sua reputação como treinador está em ${Math.round(S.tecnico.rep)}.`
    : `Campanha abaixo do esperado. Sua reputação caiu para ${Math.round(S.tecnico.rep)}.`, true);

  if (!bateu && S.diretoria.confianca < 35) { S.demitido = true; S.desempregado = true; }

  // acesso e rebaixamento entram em vigor agora, para as propostas já refletirem a divisão certa
  S.desfecho.caem.forEach(id => S.clubs[id].div = 2);
  S.desfecho.sobem.forEach(id => S.clubs[id].div = 1);
  msg("Imprensa", `Sobem para a Série A: ${S.desfecho.sobem.map(id => S.clubs[id].n).join(", ")}. Descem: ${S.desfecho.caem.map(id => S.clubs[id].n).join(", ")}.`, true);

  gerarEmpregos(true);
}

/* ---------- mercado de treinadores ---------- */
function gerarEmpregos(fimDeAno) {
  S.empregos = [];
  const meuClube = S.clubs[S.me];
  const rep = S.tecnico.rep;
  const d = S.desfecho;
  const divProx = meuClube.div;   // já atualizada com acesso/queda
  const meuRep = meuClube.rep;

  const cands = S.clubs.filter(c => {
    if (c.id === S.me && !S.desempregado) return false;
    const exigencia = (c.rep * 12) + (c.div === 1 ? 15 : 0) - 12;
    if (rep < exigencia) return false;
    if (S.desempregado) return true;
    if (c.div > divProx) return false;                    // ninguém desce de divisão à toa
    if (c.div === divProx && c.rep <= meuRep) return false; // nem troca por clube igual ou menor
    return true;
  });
  const n = S.desempregado ? Ri(2, 4) : (rep > 60 ? Ri(1, 3) : rep > 35 ? Ri(1, 2) : Ri(0, 1));
  const escolhidos = [];
  for (let i = 0; i < n * 6 && escolhidos.length < n && cands.length; i++) {
    const c = sorteia(cands, x => Math.pow(x.rep + 1, 2) * (x.div === 1 ? 2.4 : 1));
    if (!c || escolhidos.some(x => x.id === c.id)) continue;
    escolhidos.push(c);
  }
  // desempregado nunca fica sem porta: sempre aparece alguma coisa
  if (S.desempregado && !escolhidos.length) {
    const baixo = S.clubs.filter(c => c.rep <= 2 && c.id !== S.me);
    for (let i = 0; i < 2 && baixo.length; i++) {
      const c = pick(baixo);
      if (!escolhidos.some(x => x.id === c.id)) escolhidos.push(c);
    }
  }

  S.empregos = escolhidos.map(c => ({
    clube: c.id,
    meta: metaDe(c.rep, c.div),
    orcamento: Math.round(c.saldo),
    texto: c.div === 1 && divProx === 2 ? "Chance de trabalhar na elite."
      : c.rep >= 4 ? "Projeto grande, cobrança grande."
      : c.rep === 3 ? "Clube estruturado, meta realista."
      : "Reconstrução — trabalho de médio prazo."
  }));
  if (S.empregos.length && fimDeAno) {
    msg("Empresário", `${S.empregos.length} clube(s) procuraram você. Veja na aba Carreira antes de decidir a próxima temporada.`, true);
  }
}
function aceitarEmprego(clubeId) {
  const novo = S.clubs[clubeId];
  if (!novo) return { ok: false, m: "Essa proposta não está mais de pé." };
  guardarPonto();
  const antigo = S.clubs[S.me];
  S.me = clubeId;
  S.desempregado = false; S.demitido = false;
  S.diretoria = { confianca: 58 + Math.round(S.tecnico.rep / 8), meta: metaDe(novo.rep, novo.div) };
  S.diretoria.confianca = clamp(S.diretoria.confianca, 40, 85);
  S.listados = []; S.ofertas = []; S.empregos = [];
  S.receitas = [];
  S.tatica = { form: "4-2-3-1", mental: "equilibrado", press: "media", ritmo: "normal" };
  S.treino = { grupos: Object.assign({}, TREINO_PADRAO), carga: "normal" };
  autoEscalar(); refreshMercado();
  msg("Carreira", `Você assinou com o ${novo.n} (${divInfo(novo.div).n})${antigo ? ", deixando o " + antigo.n : ""}. Meta: ${S.diretoria.meta.txt}.`, true);
  return { ok: true, m: `Bem-vindo ao ${novo.n}.` };
}

function novaTemporada() {
  guardarPonto();
  S.temporada++; S.rodada = 1; S.fim = false; S.campeao = null; S.posFinal = null; S.desfecho = null;
  S.clubs.forEach(c => c.form = []);
  S.receitas = [];
  for (const p of S.players.slice()) {
    if (p.clube < 0) continue;
    p.idade++; p.j = 0; p.g = 0; p.a = 0; p.ca = 0; p.cv = 0; p.notaSoma = 0; p.amarelos = 0; p.susp = 0; p.lesao = 0;
    p.cond = Ri(80, 100); p.moral = Ri(50, 75); p.contrato--;
    delete p.conversa; delete p.promessa; delete p.sondado; if (p.interesse) p.interesse = Math.round(p.interesse * .5);
    if (p.idade >= 36) {
      if (p.clube === S.me) msg("Elenco", `${p.nome} pendurou as chuteiras aos ${p.idade} anos.`, true);
      p.clube = -2;
    } else if (p.contrato <= 0) {
      if (p.clube === S.me) msg("Contratos", `${p.nome} (${p.pos}, ${p.ovr}) saiu de graça — o contrato acabou e não foi renovado.`, true);
      p.clube = -1; p.livre = true; p.livreDesde = S.temporada; delete p.dispensar; delete p.negociado;
    }
    p.ovr = ovrOf(p); p.valor = valorDe(p);
  }
  S.players = S.players.filter(p => p.clube >= 0 || (p.clube === -1 && (p.livreDesde || 0) >= S.temporada - 1));
  S.clubs.forEach(c => {
    let sq = squadOf(c.id);
    while (sq.length < 22) {
      const falta = POSES.find(po => sq.filter(x => x.pos === po).length < 3) || pick(POSES);
      // primeiro tenta no mercado de quem ficou sem contrato
      // quem acabou de sair de contrato só fica disponível na temporada seguinte
      const livres = S.players.filter(p => p.clube === -1 && p.pos === falta && p.ovr <= 52 + c.rep * 8 && (p.livreDesde || 0) < S.temporada);
      if (livres.length && Math.random() < .75) {
        const alvo = livres.sort((a, b) => b.ovr - a.ovr)[0];
        alvo.clube = c.id; alvo.livre = false; alvo.contrato = Ri(2, 3);
        if (c.id === S.me) msg("Contratos", `${alvo.nome} (${alvo.pos}, ${alvo.ovr}) assinou de graça como agente livre.`);
      } else {
        const np = makePlayer(falta, c.rep, { idade: Ri(17, 21) });

/* pontos de retorno: guarda o estado antes de cada virada de temporada */
const PONTO_KEY = i => SAVE_KEY + ".ponto" + i;
function guardarPonto() {
  try {
    const atual = localStorage.getItem(SAVE_KEY);
    if (!atual) return;
    const p1 = localStorage.getItem(PONTO_KEY(1));
    try { if (p1) localStorage.setItem(PONTO_KEY(2), p1); } catch (e) { try { localStorage.removeItem(PONTO_KEY(2)); } catch (e2) {} }
    localStorage.setItem(PONTO_KEY(1), atual);
  } catch (e) {
    // sem espaço: joga fora o ponto mais antigo e tenta de novo
    try { localStorage.removeItem(PONTO_KEY(2)); localStorage.setItem(PONTO_KEY(1), localStorage.getItem(SAVE_KEY)); } catch (e2) {}
  }
}
function lerPontos() {
  const out = [];
  for (const i of [1, 2]) {
    try {
      const raw = localStorage.getItem(PONTO_KEY(i));
      if (!raw) continue;
      const o = JSON.parse(raw);
      if (!o || !o.clubs) continue;
      out.push({ i, raw, temporada: o.temporada, rodada: o.rodada, clube: (o.clubs[o.me] && o.clubs[o.me].n) || "?", jogadores: (o.players || []).filter(p => p.clube === o.me).length });
    } catch (e) {}
  }
  return out;
}
function migrar(o) {

  if (!o.opts) o.opts = { decisoes: true };
  if (!o.treino) o.treino = {};
  if (!o.treino.grupos) o.treino.grupos = Object.assign({}, TREINO_PADRAO);
  if (!o.treino.carga) o.treino.carga = "normal";
  if (!Array.isArray(o.ofertas)) o.ofertas = o.oferta ? [Object.assign({ expira: (o.rodada || 1) + 2, contra: 0 }, o.oferta)] : [];
  delete o.oferta;
  for (const p of o.players) {
    if (p.talento == null) p.talento = 0;
    if (p.clube === -1 && p.livreDesde == null) p.livreDesde = o.temporada;
    if (p.contrato == null || p.contrato < 1) p.contrato = Ri(2, 4);   // saves antigos: ninguém some sem aviso
  }
  for (const c of o.clubs) { if (c.amp == null) c.amp = 0; if (c.mod == null) c.mod = 0; if (c.obra === undefined) c.obra = null; }
  if (!o.clubs.some(c => c.div === 2)) o.migrarDivisoes = true;   // save de antes das divisões
  if (!o.tecnico) o.tecnico = { rep: 34, historico: [], titulos: 0, acessos: 0 };
  if (!Array.isArray(o.empregos)) o.empregos = [];

/* conserta o que costuma quebrar num save, sem apagar a carreira */

  S.players.forEach(p => { if (p.talento == null) p.talento = 0; if (p.contrato == null) p.contrato = 2; if (p.clube > 0 && !S.clubs[p.clube]) p.clube = -1; });

  if (!S.treino || !S.treino.grupos) { S.treino = { grupos: Object.assign({}, TREINO_PADRAO), carga: "normal" }; feito.push("treino"); }
  if (!S.tecnico) { S.tecnico = { rep: 34, historico: [], titulos: 0, acessos: 0 }; feito.push("carreira"); }
  S.tecnico.historico = (S.tecnico.historico || []).filter(h => h && S.clubs[h.clube]);
  S.empregos = (S.empregos || []).filter(e => e && S.clubs[e.clube]);
  S.ofertas = (S.ofertas || []).filter(o => o && byId(o.id));
  S.listados = (S.listados || []).filter(id => byId(id) && byId(id).clube === S.me);
  S.mercado = (S.mercado || []).filter(m => m && byId(m.id));
  S.inbox = (S.inbox || []).filter(m => m && typeof m.txt === "string");
  S.receitas = (S.receitas || []).filter(r => r && typeof r.r === "number");
  if (!Array.isArray(S.fixtures) || !S.fixtures.length) tente("calendário", () => { gerarCalendario(); feito.push("calendário"); });

    const divMeu = meu ? divValida(meu.div) : 1;
    const resto = S.clubs.filter(c => c !== meu);
    resto.sort((x, y) => (y.div === 1) - (x.div === 1) || (y.rep - x.rep) || (x.id - y.id));
    const vagasA = divMeu === 1 ? 19 : 20;

  UI.partida = null; UI.modal = null; UI.flash = null; UI.confirma = null;
  return feito;
}

function recorteTabela(tab, pos) {
  const n = (tab && tab.length) || 0;
  if (!n) return `<div class="empty">Tabela ainda vazia.</div>`;
  const idx = new Set();
  for (let i = 0; i < Math.min(4, n); i++) idx.add(i);
  for (let i = pos - 2; i <= pos; i++) if (i >= 0 && i < n) idx.add(i);
  idx.add(n - 1);
  const linhas = [...idx].filter(i => i >= 0 && i < n).sort((a, b) => a - b);
  let out = "", ultimo = -1;
  for (const i of linhas) {
    const t = tab[i]; if (!t) continue;
    const c = S.clubs[t.id]; if (!c) continue;
    if (ultimo >= 0 && i > ultimo + 1) out += `<div style="color:var(--chalk-faint);font-family:var(--mono);font-size:11px;padding-left:6px">···</div>`;
    ultimo = i;
    const z = i < 4 ? "lib" : i < 12 ? "sul" : i >= n - 4 ? "reb" : "";
    out += `<div class="row" style="gap:8px;padding:2px 0;${t.id === S.me ? "color:var(--clube)" : ""}">
      <span class="zn ${z}"></span>
      <span class="num" style="width:20px;font-size:12px">${i + 1}</span>
      ${crest(c, 18)}<span class="nm" style="flex:1;font-size:12.5px">${esc(c.n || "—")}</span>
      <span class="num" style="width:26px;font-size:12px;color:var(--chalk-faint)">${t.j || 0}</span>
      <b class="num" style="width:28px;font-size:12.5px">${t.pts || 0}</b>
    </div>`;
  }
  return out;
}

function ordenador() {
  const k = UI.ordem;
  if (k === "pos") return (a, b) => POSES.indexOf(a.pos) - POSES.indexOf(b.pos) || b.ovr - a.ovr;
  if (k === "idade") return (a, b) => a.idade - b.idade || b.ovr - a.ovr;
  if (k === "nota") return (a, b) => (b.j ? b.notaSoma / b.j : 0) - (a.j ? a.notaSoma / a.j : 0);
  if (k === "valor") return (a, b) => b.valor - a.valor;
  if (k === "cond") return (a, b) => a.cond - b.cond;
  return (a, b) => b.ovr - a.ovr;
}

    <div class="row" style="margin-top:14px">
      <button class="btn primary" data-act="iniciar" ${problemas ? "disabled" : ""}>Começar a partida</button>
      <button class="btn" data-act="simulardireto" ${problemas ? "disabled" : ""}>Simular sem acompanhar</button>
      <button class="btn" data-act="nav" data-v="escalacao">Rever escalação</button>
    </div>`;
  }

  const st = UI.partida;
  if (st.intervalo) return viewIntervalo(st);

  const cm = st.condAt();
  const cansados = st.xi[S.me].map(id => id && byId(id)).filter(Boolean).filter(p => (cm[p.id] || 100) < 55).length;
  const pendurados = st.xi[S.me].filter(id => id && st.cards[id] === 1).length;

  return `<h2 class="vt">${st.fim ? "Fim de jogo" : "Ao vivo"}</h2>
  <p class="vs">${esc(S.clubs[st.h].e)} · ${S.rodada}ª rodada.</p>
  <div class="matchwrap">
    ${placarHTML(st)}
    <div class="row">
      ${st.fim ? `<button class="btn primary" data-act="encerrar">Encerrar rodada</button>`
      : `<span class="seg">${[[1, "1×"], [3, "3×"], [6, "6×"]].map(([v, n]) => `<button data-act="vel" data-v="${v}" aria-pressed="${UI.vel === v}">${n}</button>`).join("")}</span>
         <button class="btn" data-act="pausar">${UI.timer ? "Pausar" : "Retomar"}</button>
         ${!st.intervaloFeito ? `<button class="btn" data-act="pularint">Pular pro intervalo</button>` : ""}
         <button class="btn" data-act="ateofim">Ir para o fim</button>
         <button class="btn" data-act="modalsub">Substituir · ${st.subs[S.me]}/5</button>
         <button class="btn" data-act="toggledec" title="Pausar o jogo em pênaltis, cartões, lesões e no intervalo">Decisões: ${st.decisoes ? "ligadas" : "desligadas"}</button>
         ${cansados ? `<span class="tag bad">${cansados} desgastado(s)</span>` : ""}
         ${pendurados ? `<span class="tag on">${pendurados} pendurado(s)</span>` : ""}`}
    </div>
    <div class="two-wide">
      <div class="panel">
        <div class="ph"><h3>Narração</h3></div>
        <div class="commentary" id="narr">
          ${st.ev.length ? st.ev.slice().reverse().map(evHTML).join("") : `<div class="empty">Bola rolando.</div>`}
        </div>
      </div>
      <div class="grid">
        ${st.fim ? "" : `<div class="panel"><div class="ph"><h3>Do banco</h3><span class="sp"></span><span class="tag">muda na hora</span></div>${bancoRapidoHTML(st)}</div>`}
        <div class="panel"><div class="ph"><h3>Números do jogo</h3></div>
          <div class="pb mstats" id="pl-stats">${statsHTML(st)}</div></div>
        <div class="panel"><div class="ph"><h3>Seu time em campo</h3></div>
          <div class="pb" style="display:grid;gap:4px" id="pl-campo">${campoHTML(st)}</div></div>
      </div>
    </div>
  </div>`;
}

/* ---------- intervalo ---------- */
function viewIntervalo(st) {
  const meuGols = S.me === st.h ? st.gh : st.ga, deles = S.me === st.h ? st.ga : st.gh;
  const cm = st.condAt();
  const titulares = st.xi[S.me].map(id => id && byId(id)).filter(Boolean);
  const t = st.tat[S.me];
  const seg = (campo, lista) => `<span class="seg mini">${lista.map(o =>
    `<button data-act="tatlive" data-campo="${campo}" data-k="${o.k}" aria-pressed="${t[campo] === o.k}">${o.n}</button>`).join("")}</span>`;
  const DISCURSOS = [
    { k: "elogiar", n: "Elogiar o grupo", d: "Funciona quando o time está por cima. Se estiver perdendo, soa como conformismo." },
    { k: "cobrar", n: "Cobrar atitude", d: "Levanta quem está atrás no placar. Se estiver ganhando, quebra a confiança." },
    { k: "calma", n: "Manter a calma", d: "Ganho pequeno, sem risco. Reforça o plano de jogo." }
  ];

  return `<h2 class="vt">Intervalo</h2>
  <p class="vs">${meuGols > deles ? "Você está na frente." : meuGols < deles ? "Você está atrás no placar." : "Empate parcial."} 15 minutos para mexer no jogo.</p>
  ${placarHTML(st)}
  <div class="two" style="margin-top:14px">
    <div class="grid" style="align-content:start">
      <div class="panel">
        <div class="ph"><h3>Conversa no vestiário</h3><span class="sp"></span>
          ${st.vestiario ? `<span class="tag ${st.vestiario.delta > 0 ? "good" : "bad"}">moral ${st.vestiario.delta > 0 ? "+" : ""}${st.vestiario.delta}</span>` : `<span class="tag on">escolha uma</span>`}</div>
        <div class="pb" style="display:grid;gap:8px">
          ${DISCURSOS.map(d => `<button class="dec" data-act="discurso" data-k="${d.k}" ${st.vestiario ? "disabled" : ""}
            aria-pressed="${st.vestiario && st.vestiario.escolha === d.k}">
            <b>${d.n}</b><span>${d.d}</span></button>`).join("")}
        </div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Ajuste de postura</h3></div>
        <div class="pb" style="display:grid;gap:9px">
          <div><u class="micro">Mentalidade</u>${seg("mental", MENTAL)}</div>
          <div><u class="micro">Pressão</u>${seg("press", PRESS)}</div>
          <div><u class="micro">Ritmo</u>${seg("ritmo", RITMO)}</div>
        </div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel"><div class="ph"><h3>Primeiro tempo em números</h3></div>
        <div class="pb mstats">${statsHTML(st)}</div></div>
      <div class="panel">
        <div class="ph"><h3>Como estão os titulares</h3><span class="sp"></span>
          <button class="btn sm" data-act="modalsub">Substituir · ${st.subs[S.me]}/5</button></div>
        <div class="pb" style="display:grid;gap:5px">
          ${titulares.map(p => {
            const c = cm[p.id] != null ? cm[p.id] : p.cond;
            return `<div class="row" style="gap:7px">
              <span class="pos ${p.pos}">${p.pos}</span>
              <span class="nm" style="flex:1;font-size:12.5px">${esc(p.nome)}${st.cards[p.id] === 1 ? ' <span style="color:var(--placar)">▮</span>' : ""}</span>
              <span style="width:46px">${bar(c, c < 45 ? "var(--loss)" : c < 68 ? "var(--placar)" : "var(--win)")}</span>
              <span class="num" style="width:30px;font-size:12px">${(st.nota[p.id] || 6).toFixed(1)}</span></div>`;
          }).join("")}
        </div>
      </div>
    </div>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" data-act="voltarst">Voltar pro segundo tempo</button>
    ${st.vestiario ? "" : `<span style="font-size:12.5px;color:var(--chalk-faint)">Você ainda não falou com o grupo.</span>`}
  </div>`;
}

/* ---------- decisões no meio do jogo ---------- */
function pausaModal() {
  const st = UI.partida; if (!st || !st.pausa) return "";
  const pa = st.pausa;

  if (pa.tipo === "penalti") {
    const cands = pa.cands.map(byId).filter(Boolean);
    return `<div class="scrim"><div class="modal">
      <div class="ph"><h3>Pênalti a favor · ${st.label(st.min)}</h3></div>
      <div class="pb" style="display:grid;gap:10px">
        <p style="margin:0;color:var(--chalk-dim);font-size:13px">Quem vai bater? A finalização do jogador muda a chance de converter.</p>
        ${cands.map(p => `<button class="dec" data-act="bater" data-id="${p.id}">
          <b>${esc(p.nome)} <span class="pos ${p.pos}">${p.pos}</span></b>
          <span>Finalização ${p.fin} · chance estimada ${Math.round(clamp(.62 + p.fin / 320 + (p.pos === "ATA" || p.pos === "MEI" ? .05 : 0), .55, .90) * 100)}%</span></button>`).join("")}
      </div></div></div>`;
  }

  if (pa.tipo === "amarelo") {
    const p = byId(pa.id);
    const banco = st.banco[S.me].map(byId).filter(q => q && q.lesao === 0 && !st.jogaram.has(q.id));
    const podeSub = st.subs[S.me] < 5 && banco.length;
    return `<div class="scrim"><div class="modal">
      <div class="ph"><h3>Amarelo em ${esc(p.nome)} · ${st.label(st.min)}</h3></div>
      <div class="pb" style="display:grid;gap:10px">
        <p style="margin:0;color:var(--chalk-dim);font-size:13px">Pendurado. Se levar o segundo, o time joga com um a menos.</p>
        <button class="dec" data-act="dec-amarelo" data-k="leve"><b>Mandar pegar leve</b><span>Ele quase não entra mais na dividida. Sua defesa perde um pouco de força.</span></button>
        ${podeSub ? `<button class="dec" data-act="dec-amarelo" data-k="sair"><b>Tirar do jogo agora</b><span>Gasta uma substituição, mas elimina o risco.</span></button>` : ""}
        <button class="dec" data-act="dec-amarelo" data-k="nada"><b>Deixar como está</b><span>Confiar no jogador e seguir com o time inteiro.</span></button>
      </div></div></div>`;
  }

  if (pa.tipo === "lesao") {
    const p = byId(pa.id);
    const banco = st.banco[S.me].map(byId).filter(q => q && q.lesao === 0 && !st.jogaram.has(q.id));
    const podeSub = st.subs[S.me] < 5 && banco.length;
    return `<div class="scrim"><div class="modal">
      <div class="ph"><h3>${pa.grave ? "Lesão" : "Jogador sentindo"} · ${esc(p.nome)}</h3></div>
      <div class="pb" style="display:grid;gap:10px">
        <p style="margin:0;color:var(--chalk-dim);font-size:13px">${pa.grave
          ? "Não tem como continuar. Escolha quem entra no lugar."
          : "Ele diz que aguenta. Você decide se tira ou arrisca."}</p>
        ${!pa.grave ? `<button class="dec" data-act="dec-lesao" data-k="arriscar"><b>Deixar continuar</b><span>Segue em campo bem abaixo do normal e pode agravar a lesão.</span></button>` : ""}
        ${podeSub ? `<div><u class="micro">Substituir por</u><div class="benchlist" style="max-height:230px;border:1px solid var(--line);border-radius:6px;margin-top:5px">
          ${banco.sort((a, b) => AFF[b.pos][p.pos] - AFF[a.pos][p.pos] || b.ovr - a.ovr).map(q => `<div class="plrow" data-act="dec-lesao-sub" data-id="${q.id}">
            <span class="pos ${q.pos}">${q.pos}</span><span class="nm">${esc(q.nome)}</span>
            <span class="tag ${AFF[q.pos][p.pos] >= .9 ? "good" : AFF[q.pos][p.pos] >= .75 ? "" : "bad"}">${Math.round(AFF[q.pos][p.pos] * 100)}%</span>
            <span class="ovr ${ovrCls(q.ovr)}">${q.ovr}</span></div>`).join("")}
        </div></div>`
        : `<button class="dec" data-act="dec-lesao" data-k="sair"><b>Jogar com um a menos</b><span>Sem substituições disponíveis.</span></button>`}
      </div></div></div>`;
  }
  return "";
}

function subModal() {
  const st = UI.partida; if (!st) return "";
  const cm = st.condAt();
  const campo = st.xi[S.me].map(id => id && byId(id)).filter(Boolean);
  const banco = st.banco[S.me].map(id => byId(id)).filter(p => p && p.lesao === 0 && !st.jogaram.has(p.id));
  return `<div class="scrim" data-act="scrim"><div class="modal">
    <div class="ph"><h3>Substituição — ${st.subs[S.me]}/5 usadas</h3><span class="sp"></span><button class="xbtn est" data-act="fecharModal" aria-label="Fechar">&times;</button></div>
    <div class="pb" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div><p class="micro">Sai</p>
        ${(UI.modal === "sub-amarelo" ? campo.filter(p => p.id === UI.sai) : campo).map(p => { const c = cm[p.id] != null ? cm[p.id] : p.cond;
          return `<div class="plrow ${UI.sai === p.id ? "sel" : ""}" data-act="sai" data-id="${p.id}">
          <span class="pos ${p.pos}">${p.pos}</span><span class="nm">${esc(p.nome)}</span>
          <span style="width:36px">${bar(c, c < 45 ? "var(--loss)" : c < 68 ? "var(--placar)" : "var(--win)")}</span>
          <span class="num" style="width:26px;font-size:11px">${(st.nota[p.id] || 6).toFixed(1)}</span></div>`; }).join("")}</div>
      <div><p class="micro">Entra</p>
        ${banco.length ? banco.map(p => `<div class="plrow ${UI.entra === p.id ? "sel" : ""}" data-act="entra" data-id="${p.id}">
          <span class="pos ${p.pos}">${p.pos}</span><span class="nm">${esc(p.nome)}</span><span class="ovr ${ovrCls(p.ovr)}">${p.ovr}</span></div>`).join("") : `<div class="empty">Ninguém disponível no banco.</div>`}</div>
    </div>
    <div class="pb" style="padding-top:0"><div class="row">
      <button class="btn primary" data-act="confirmarsub" ${UI.sai && UI.entra ? "" : "disabled"}>Confirmar substituição</button>
      <button class="btn" data-act="fecharModal">Cancelar</button>
    </div></div>
  </div></div>`;
}

function viewFimTemporada() {
  const d = S.desfecho || {};
  const div = d.div || minhaDiv();
  const tab = d.tabela || tabela(div);
  const pos = d.pos || tab.findIndex(t => t.id === S.me) + 1;
  const empregos = S.empregos || [];

  if (S.demitido) {
    return `<h2 class="vt">Você foi demitido</h2>
    <p class="vs">${S.rodada > 38
      ? `A diretoria não renovou depois da campanha de ${pos}º lugar na ${divInfo(div).n}.`
      : `A diretoria perdeu a paciência na ${S.rodada}ª rodada, com o time em ${pos}º lugar na ${divInfo(div).n}.`}
      Sua reputação está em ${Math.round(S.tecnico.rep)}. Assine com um novo clube para continuar a carreira.</p>
    ${empregos.length ? `<div class="panel"><div class="ph"><h3>Quem ainda quer o seu trabalho</h3></div>
      ${empregos.map(e => { const cl = S.clubs[e.clube];
        return `<div class="emprego">
          <div class="emprego-quem">${crest(cl, 34)}<div><b>${esc(cl.n)}</b>
            <span>${divInfo(cl.div).n} · caixa ${brl(e.orcamento, true)}</span>
            <span class="emprego-meta">${esc(e.meta.txt)}</span></div></div>
          <div class="emprego-txt">${esc(e.texto)}</div>
          <button class="btn primary sm" data-act="aceitar-emprego" data-id="${e.clube}">Assinar</button>
        </div>`; }).join("")}</div>`
      : `<div class="panel"><div class="pb">Nenhum clube procurou você por enquanto.</div></div>`}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="reiniciar">Começar um novo jogo</button></div>`;
  }

  const faixa = d.campeao ? { t: "Campeão da " + divInfo(div).n, c: "ouro" }
    : d.subiu ? { t: "Acesso conquistado", c: "verde" }
    : d.caiu ? { t: "Rebaixado", c: "vermelho" }
    : { t: `${pos}º lugar na ${divInfo(div).n}`, c: "" };

  return `<h2 class="vt">Temporada ${S.temporada} encerrada</h2>
  <p class="vs">${d.campeao ? "O título é seu." : d.subiu ? "O clube está de volta à elite." : d.caiu ? "Ano para esquecer." : "Fim de linha da temporada."}</p>

  <div class="fecho ${faixa.c}">
    ${crest(me(), 56)}
    <div><b>${esc(faixa.t)}</b><span>${esc(me().n)} · ${linhaTab(tab, pos).pts} pontos · reputação ${Math.round(S.tecnico.rep || 0)}</span></div>
  </div>

  <div class="two" style="margin-top:14px;align-items:start">
    <div class="panel"><div class="ph"><h3>Como terminou a ${divInfo(div).n}</h3></div>
      <div class="pb" style="display:grid;gap:8px">
        ${tab.slice(0, 4).map((t, i) => `<div class="row" style="gap:10px">${crest(S.clubs[t.id], 26)}
          <b style="font-family:var(--display);font-size:16px;text-transform:uppercase">${i + 1}º ${esc(S.clubs[t.id].n)}</b>
          <span class="sp"></span><span class="num">${t.pts} pts</span></div>`).join("")}
        <div class="hr" style="margin:4px 0"></div>
        <div style="font-size:12px;color:var(--chalk-faint)">
          ${d.sobem ? "Sobem à Série A: " + d.sobem.map(id => esc(S.clubs[id].n)).join(", ") : ""}
          ${d.caem ? "<br>Descem: " + d.caem.map(id => esc(S.clubs[id].n)).join(", ") : ""}</div>
      </div></div>

    <div class="panel">
      <div class="ph"><h3>Propostas para a próxima temporada</h3><span class="sp"></span><span class="tag ${empregos.length ? "on" : ""}">${empregos.length || "nenhuma"}</span></div>
      ${empregos.length ? empregos.map(e => { const cl = S.clubs[e.clube];
        return `<div class="emprego">
          <div class="emprego-quem">${crest(cl, 34)}<div><b>${esc(cl.n)}</b>
            <span>${divInfo(cl.div).n} · caixa ${brl(e.orcamento, true)}</span>
            <span class="emprego-meta">${esc(e.meta.txt)}</span></div></div>
          <div class="emprego-txt">${esc(e.texto)}</div>
          <button class="btn primary sm" data-act="aceitar-emprego" data-id="${e.clube}">Assinar</button>
        </div>`; }).join("")
      : `<div class="empty">Ninguém veio buscar você. Siga no ${esc(me().n)} e faça uma campanha que chame atenção.</div>`}
    </div>
  </div>

  ${(() => { const dst = destaquesDaTemporada(); return dst.length ? `
  <div class="panel" style="margin-top:14px">
    <div class="ph"><h3>Destaques da temporada</h3><span class="sp"></span><span class="tag">elogio público dá moral e valoriza</span></div>
    <div class="pb destaques">
      ${dst.map(p => `<div class="pmini" style="cursor:default">
        <b>${(p.notaSoma / p.j).toFixed(1)}</b>
        <span class="pmini-nome">${esc(p.nome)}${craque(p)}</span>
        <span class="pmini-linha"><span class="pos ${p.pos}">${p.pos}</span><span style="font-size:11px;color:var(--chalk-faint)">${p.j}J ${p.g}G</span></span>
        <button class="btn sm ${p.elogiadoEm === S.temporada ? "" : "primary"}" data-act="elogio-publico" data-id="${p.id}" ${p.elogiadoEm === S.temporada ? "disabled" : ""} style="margin-top:5px;width:100%">
          ${p.elogiadoEm === S.temporada ? "Elogiado" : "Elogiar"}</button>
      </div>`).join("")}
    </div>
  </div>` : ""; })()}

  <div class="row" style="margin-top:14px">
    <button class="btn primary" data-act="novatemp">Seguir no ${esc(me().n)} · temporada ${S.temporada + 1}</button>
    ${empregos.length ? `<span style="font-size:12.5px;color:var(--chalk-faint)">ou assine com um dos clubes acima antes de continuar</span>` : ""}
  </div>`;
}

/* ============================================================
   tabela / calendário
   ============================================================ */
function viewTabela() {
  const div = UI.tabDiv || minhaDiv();
  const tab = tabela(div);
  return `<h2 class="vt">Classificação</h2>
  <p class="vs">${divInfo(div).n} ${S.temporada} · ${Math.min(S.rodada - 1, 38)} rodada(s) disputadas.</p>
  <div class="panel">
    <div class="ph"><h3>${divInfo(div).n}</h3><span class="sp"></span>
      <span class="seg">${[1, 2].map(d => `<button data-act="tabdiv" data-k="${d}" aria-pressed="${div === d}">${divInfo(d).n}</button>`).join("")}</span></div>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Clube</th><th class="num">P</th><th class="num">J</th><th class="num">V</th><th class="num">E</th><th class="num">D</th><th class="num">GP</th><th class="num">GC</th><th class="num">SG</th><th class="num">%</th><th>Últimos</th></tr></thead>
      <tbody>${tab.map((t, i) => {
        const z = div === 2 ? (i < 4 ? "lib" : i >= 16 ? "reb" : "") : (i < 4 ? "lib" : i < 12 ? "sul" : i >= 16 ? "reb" : "");
        const c = S.clubs[t.id];
        return `<tr class="${t.id === S.me ? "me" : ""}">
          <td class="num" style="width:44px"><span class="zn ${z}"></span>${i + 1}</td>
          <td class="nm"><span class="celclube">${crest(c, 22)}${esc(c.n)}</span></td>
          <td class="num"><b>${t.pts}</b></td><td class="num">${t.j}</td><td class="num">${t.v}</td><td class="num">${t.e}</td><td class="num">${t.d}</td>
          <td class="num">${t.gp}</td><td class="num">${t.gc}</td><td class="num">${t.sg > 0 ? "+" : ""}${t.sg}</td><td class="num">${t.ap}</td>
          <td>${formLine(c.form)}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
    <div class="legend">
      <span><i class="zn lib"></i>${div === 2 ? "Acesso à Série A" : "Libertadores (G4)"}</span>
      ${div === 1 ? '<span><i class="zn sul"></i>Sul-Americana</span>' : ""}
      <span><i class="zn reb"></i>Rebaixamento</span>
    </div>
  </div>`;
}

function viewCalendario() {
  const meus = S.fixtures.filter(f => f.h === S.me || f.a === S.me);
  return `<h2 class="vt">Calendário</h2>
  <p class="vs">Seus 38 jogos na Série A ${S.temporada}.</p>
  <div class="panel"><div class="scroll"><table>
    <thead><tr><th>Rod.</th><th>Local</th><th>Adversário</th><th class="num">Placar</th><th>Resultado</th></tr></thead>
    <tbody>${meus.map(f => {
      const casa = f.h === S.me;
      const adv = S.clubs[casa ? f.a : f.h];
      const jogado = f.gh !== null;
      const meus_ = casa ? f.gh : f.ga, deles = casa ? f.ga : f.gh;
      const r = !jogado ? "" : meus_ > deles ? "V" : meus_ < deles ? "D" : "E";
      return `<tr class="${f.r === S.rodada ? "me" : ""}">
        <td class="num">${f.r}</td>
        <td><span class="tag">${casa ? "Casa" : "Fora"}</span></td>

        <div class="oferta-quem">${crest(S.clubs[o.clube])}<div>

}

/* ============================================================
   treino
   ============================================================ */
function viewTreino() {
  const sq = squadOf(S.me).slice().sort((a, b) => a.cond - b.cond);
  const carga = CARGAS.find(t => t.k === S.treino.carga);
  const gr = S.treino.grupos || TREINO_PADRAO;

  const painel = k => {
    const g = TREINO_GRUPOS[k];
    const f = focoDe(k);
    const n = squadOf(S.me).filter(p => GRUPO[p.pos] === k).length;
    return `<div class="panel">
      <div class="ph"><h3>${g.n}</h3><span class="sp"></span><span class="tag">${esc(g.pos)} · ${n}</span></div>
      <div class="pb" style="display:grid;gap:9px">
        <div class="focos">${g.focos.map(o => `<button class="foco" data-act="foco" data-g="${k}" data-k="${o.k}" aria-pressed="${gr[k] === o.k}">${o.n}</button>`).join("")}</div>
        <p style="margin:0;font-size:12.5px;color:var(--chalk-dim)">${esc(f.d)}</p>
        <div class="row" style="gap:6px">${Object.keys(f.g).length
          ? Object.keys(f.g).map(a => `<span class="tag on">${ATT_FULL[a]} +${f.g[a].toFixed(1)}</span>`).join("")
          : `<span class="tag good">Condição +11</span>`}</div>
      </div></div>`;
  };

  return `<h2 class="vt">Treino</h2>
  <p class="vs">Cada grupo treina o que faz sentido para a função dele. A carga vale para o elenco inteiro e decide quanto o time recupera de condição — e o risco de lesão na semana.</p>
  <div class="panel" style="margin-bottom:14px">
    <div class="ph"><h3>Carga da semana</h3><span class="sp"></span>
      <span class="tag ${carga.risk > 1 ? "bad" : "good"}">risco ${carga.risk > 1 ? "elevado" : "controlado"}</span></div>
    <div class="pb" style="display:grid;gap:9px">
      <span class="seg">${CARGAS.map(t => `<button data-act="carga" data-k="${t.k}" aria-pressed="${S.treino.carga === t.k}">${t.n}</button>`).join("")}</span>
      <p style="margin:0;font-size:12.5px;color:var(--chalk-dim)">Recuperação de condição ${carga.fit >= 2 ? "alta" : "baixa"} · ganho técnico ×${carga.gain} · risco de lesão ×${carga.risk}</p>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(255px,1fr))">
    ${["gol", "def", "mei", "ata"].map(painel).join("")}
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="ph"><h3>Condição física do elenco</h3><span class="sp"></span><span class="tag">abaixo de 60% o jogador rende bem menos</span></div>
    <div class="scroll"><table>
      <thead><tr><th>Pos</th><th>Jogador</th><th>Treina</th><th class="num">Idade</th><th class="num">OVR</th><th class="num">Pot.</th><th>Condição</th><th>Moral</th><th>Situação</th></tr></thead>
      <tbody>${sq.map(p => `<tr>
        <td><span class="pos ${p.pos}">${p.pos}</span></td><td class="nm">${esc(p.nome)}${craque(p)}</td>
        <td style="font-size:12px;color:var(--chalk-dim)">${esc(focoDe(GRUPO[p.pos]).n)}</td>
        <td class="num">${p.idade}</td><td class="num"><span class="ovr ${ovrCls(p.ovr)}">${p.ovr}</span></td>
        <td class="num" style="color:${p.pot > p.ovr ? "var(--win)" : "var(--chalk-faint)"}">${p.pot}</td>
        <td style="min-width:90px">${bar(p.cond)} <span class="num" style="font-size:11px">${Math.round(p.cond)}%</span></td>
        <td style="min-width:90px">${bar(p.moral, "var(--sul)")}</td>
