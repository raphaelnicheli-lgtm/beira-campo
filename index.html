<title>Beira-Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --pitch-0:#0B100D; --pitch-1:#121A15; --pitch-2:#18231D; --pitch-3:#1F2C25;
  --line:#25332B; --line-soft:#1C2721;
  --chalk:#E8EFE7; --chalk-dim:#9AAD9F; --chalk-faint:#65776B;
  --placar:#FFB020; --placar-deep:#3B2A0B; --placar-ink:#1A1204;
  --win:#4FBF86; --draw:#8C9E92; --loss:#E2615C;
  --lib:#4FBF86; --sul:#6C9FD8; --reb:#E2615C;
  --display:"Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:11px;
  --clube:#FFB020; --clube-a:#FFB020; --clube-b:#111; --clube-ink:#101613;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--pitch-0); color:var(--chalk);
  font-family:var(--body); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--placar);outline-offset:2px;border-radius:3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--pitch-0)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#33453a}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
.rail{
  background:var(--pitch-1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:14px 10px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:baseline;gap:7px;padding:4px 8px 16px}
.brand b{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:9px;color:var(--chalk-faint);letter-spacing:.14em;text-transform:uppercase}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:8px 10px;border-radius:var(--r);
  color:var(--chalk-dim);font-size:13.5px;font-weight:500;transition:background .12s,color .12s;
}
.navbtn:hover{background:var(--pitch-2);color:var(--chalk)}
.navbtn[aria-current="true"]{background:var(--pitch-3);color:var(--chalk);box-shadow:inset 3px 0 0 var(--clube)}
.navbtn[aria-current="true"] .ico{color:var(--clube)}
.ico{width:16px;flex:none;display:grid;place-items:center;color:var(--chalk-faint)}
.ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbadge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--placar);color:var(--placar-ink);border-radius:20px;padding:0 6px;font-weight:600}
.railfoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:6px}
.tinybtn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--chalk-faint)}
.tinybtn:hover{color:var(--chalk);border-color:var(--chalk-faint)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:13px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--clube) 20%,transparent) 0%,transparent 46%),
    var(--pitch-1);
  box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--clube) 42%,transparent);
}
.club-id{display:flex;align-items:center;gap:12px;min-width:0}
.club-txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.club-txt span{font-size:11.5px;color:var(--chalk-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{display:inline-block;flex:none;width:30px;line-height:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.crest svg{width:100%;height:100%;display:block}
.club-txt b{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--chalk)}
.topmeta{margin-left:auto;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.meta{display:flex;flex-direction:column;line-height:1.25}
.meta u{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--chalk-faint)}
.meta b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.meta.big b{font-family:var(--display);font-size:27px;font-weight:600;line-height:1;color:var(--clube)}
.meta.big b i{font-style:normal;font-size:14px;opacity:.6}
.minibar{display:block;height:3px;border-radius:2px;background:var(--pitch-3);overflow:hidden;margin-top:4px;width:56px}
.minibar i{display:block;height:100%}

.view{padding:22px;flex:1;min-width:0;max-width:1180px;width:100%}
h2.vt{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 2px;letter-spacing:.01em;text-wrap:balance}
p.vs{margin:0 0 18px;color:var(--chalk-dim);font-size:13px;max-width:62ch}

/* ---------- primitives ---------- */
.panel{background:var(--pitch-1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-soft)}
.ph h3{margin:0;font-size:13.5px;letter-spacing:.005em;color:var(--chalk);font-weight:600}
.ph .sp{margin-left:auto}
.pb{padding:14px}
.grid{display:grid;gap:14px}
.grid>*,.two>*,.two-wide>*,.hub>*,.lineup>*,.matchwrap>*{min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  background:var(--pitch-2);border:1px solid var(--line);border-radius:6px;
  padding:7px 13px;font-size:13px;font-weight:500;transition:.12s;
}
.btn:hover{background:var(--pitch-3);border-color:var(--chalk-faint)}
.btn.primary{background:var(--placar);border-color:var(--placar);color:var(--placar-ink);font-weight:600}
.btn.primary:hover{background:#FFC24D;border-color:#FFC24D}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.seg{display:inline-flex;background:var(--pitch-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:5px 11px;border-radius:5px;font-size:12.5px;color:var(--chalk-dim)}
.seg button[aria-pressed="true"]{background:var(--placar);color:var(--placar-ink);font-weight:600}
.tag{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--pitch-3);color:var(--chalk-dim);font-weight:600}
.tag.on{background:var(--placar-deep);color:var(--placar)}
.tag.bad{background:#3a1c1b;color:var(--loss)}
.tag.good{background:#12301f;color:var(--win)}

table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto}
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--chalk-faint);font-weight:600;text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.pick:hover{background:var(--pitch-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}

.ovr{font-family:var(--mono);font-weight:600;font-size:12.5px;display:inline-grid;place-items:center;min-width:26px;padding:2px 4px;border-radius:4px;background:var(--pitch-3)}
.ovr.t1{background:#123324;color:#6ad39c}
.ovr.t2{background:#2c3113;color:#c8d96a}
.ovr.t3{background:#3a2a0b;color:var(--placar)}
.pos{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 5px;border-radius:4px;background:var(--pitch-3);color:var(--chalk-dim)}
.pos.GOL{background:#3a2c10;color:#e8b45c}
.pos.ZAG,.pos.LAT{background:#122a33;color:#6fc0d8}
.pos.VOL,.pos.MEI{background:#152f21;color:#69c894}
.pos.PON,.pos.ATA{background:#33161c;color:#e0798f}

.bar{display:block;height:4px;border-radius:3px;background:var(--pitch-3);overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;border-radius:3px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:0}
.stat u{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint)}
.stat b{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.money.pos{background:none;color:var(--win);padding:0;font-family:var(--mono)}
.money.neg{color:var(--loss);font-family:var(--mono)}

.empty{color:var(--chalk-faint);font-size:13px;padding:22px 14px;text-align:center}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- hub ---------- */
.hub{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.nextmatch{position:relative;overflow:hidden}
.nextmatch .pb{display:grid;gap:14px}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs-side{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.vs-side .crest{width:46px;height:52px}
.vs-side .crest i{font-size:12px;letter-spacing:-.02em;padding:0 3px}
.vs-side b{font-family:var(--display);font-size:15px;font-weight:500;line-height:1.15}
.vs-side u{text-decoration:none;font-family:var(--mono);font-size:9.5px;color:var(--chalk-faint);letter-spacing:.1em}
.vs-mid{font-family:var(--display);font-size:13px;color:var(--chalk-faint);letter-spacing:.16em}
.formline{display:flex;gap:3px}
.fm{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
.fm.V{background:#12301f;color:var(--win)} .fm.E{background:#232c26;color:var(--draw)} .fm.D{background:#361a19;color:var(--loss)}
.fm.x{background:var(--pitch-2);color:var(--chalk-faint)}

.inbox{display:flex;flex-direction:column}
.msg{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:grid;gap:3px}
.msg:last-child{border-bottom:0}
.msg u{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint)}
.msg p{margin:0;font-size:13px;color:var(--chalk-dim)}
.msg.hi u{color:var(--placar)}
.msgs{max-height:340px;overflow-y:auto}

.duelo{position:relative}
.duelo::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(100deg,color-mix(in srgb,var(--ca) 26%,transparent) 0%,transparent 40%),
    linear-gradient(260deg,color-mix(in srgb,var(--cb) 26%,transparent) 0%,transparent 40%);
}
.duelo>*{position:relative}
.vs-side b{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.vs-mid{font-family:var(--display);font-size:15px;color:var(--chalk-faint);letter-spacing:.2em}

/* ---------- escalação ---------- */
.lineup{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.field{
  position:relative;aspect-ratio:68/100;max-width:min(100%,430px);margin:0 auto;border-radius:var(--r);
  background:
    repeating-linear-gradient(0deg,#16241a 0 8.5%,#132018 8.5% 17%);
  border:1px solid var(--line);overflow:hidden;
}
.field .mk{position:absolute;border:1.5px solid rgba(232,239,231,.13)}
.slot{
  position:absolute;transform:translate(-50%,-50%);width:70px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
}
.dot{
  width:38px;height:44px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.01em;
  background:linear-gradient(165deg,var(--pitch-3),var(--pitch-2));
  border:1.5px solid var(--line);color:var(--chalk-dim);transition:.12s;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.slot:hover .dot{border-color:var(--placar)}
.slot.filled .dot{
  background:linear-gradient(165deg,color-mix(in srgb,var(--clube) 30%,var(--pitch-3)),var(--pitch-2));
  border-color:color-mix(in srgb,var(--clube) 55%,var(--line));color:var(--chalk);
}
.slot.sel .dot{border-color:var(--placar);box-shadow:0 0 0 3px rgba(255,176,32,.22)}
.slot small{
  font-size:10px;background:rgba(11,16,13,.82);padding:1px 5px;border-radius:3px;
  max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.benchlist{max-height:430px;overflow-y:auto}
.plrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.plrow:hover{background:var(--pitch-2)}
.plrow.sel{background:var(--placar-deep)}
.plrow .nm{flex:1;font-size:12.5px}

/* ---------- partida ---------- */
.matchwrap{display:grid;gap:14px}
.scoreboard{
  background:
    linear-gradient(100deg,color-mix(in srgb,var(--ca,#141d17) 30%,transparent) 0%,transparent 38%),
    linear-gradient(260deg,color-mix(in srgb,var(--cb,#141d17) 30%,transparent) 0%,transparent 38%),
    linear-gradient(180deg,#16211a,#0e1512);
  border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px 23px;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
}
.sb-team{display:flex;align-items:center;gap:11px;min-width:0}
.sb-team.away{flex-direction:row-reverse;text-align:right}
.sb-team b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-mid{text-align:center;display:grid;gap:4px;justify-items:center}
.sb-score{font-family:var(--display);font-size:52px;font-weight:600;letter-spacing:.03em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.sb-clock{font-family:var(--mono);font-size:12px;color:var(--placar);letter-spacing:.1em;font-weight:600}
.scoreboard{position:relative}
.clockbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pitch-3);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.clockbar i{display:block;height:100%;background:var(--placar);transition:width .2s linear}
.clockbar u{position:absolute;top:0;bottom:0;width:1px;background:rgba(232,239,231,.3)}

.golband{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:10px 18px;border-radius:var(--r);border:1px solid var(--placar);
  background:linear-gradient(90deg,var(--placar-deep),transparent 70%);
  animation:golin .45s cubic-bezier(.2,1.3,.4,1);
}
.golband.contra{border-color:var(--loss);background:linear-gradient(90deg,#3a1c1b,transparent 70%)}
.golband b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.06em;color:var(--placar);text-transform:uppercase}
.golband.contra b{color:var(--loss)}
.golband span{font-size:13px;color:var(--chalk-dim)}
.golband .pl{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--chalk);font-variant-numeric:tabular-nums}
@keyframes golin{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}

.dec{
  display:grid;gap:3px;text-align:left;width:100%;
  background:var(--pitch-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;transition:.12s;
}
.dec:hover:not(:disabled){border-color:var(--placar);background:var(--pitch-3)}
.dec[aria-pressed="true"]{border-color:var(--placar);background:var(--placar-deep)}
.dec:disabled{opacity:.45;cursor:default}
.dec b{font-size:13.5px;font-weight:600}
.dec span{font-size:12px;color:var(--chalk-dim);line-height:1.4}

.seg.mini{width:100%}
.seg.mini button{padding:4px 8px;font-size:11.5px;flex:1;white-space:nowrap}
.micro{display:block;text-decoration:none;margin:0 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint);font-weight:600}

.commentary{max-height:390px;overflow-y:auto;display:flex;flex-direction:column-reverse}
.ev{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft);animation:evin .28s ease-out}
@keyframes evin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ev time{font-family:var(--mono);font-size:12px;color:var(--chalk-faint);font-variant-numeric:tabular-nums}
.ev p{margin:0;font-size:13px;color:var(--chalk-dim)}
.ev.gol{background:linear-gradient(90deg,rgba(255,176,32,.13),transparent)}
.ev.sub p{color:var(--chalk-faint);font-style:italic}
.ev.gol p{color:var(--chalk);font-weight:600}
.ev.gol time{color:var(--placar)}
.ev.red p{color:var(--loss)}
.ev.big p{color:var(--chalk)}
.mstats{display:grid;gap:9px}
.msrow{display:grid;grid-template-columns:40px 1fr 40px;gap:9px;align-items:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.msrow .lbl{grid-column:1/-1;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-faint);margin-bottom:-5px}
.msbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--pitch-3)}
.msbar i{display:block;height:100%}

/* colunas duplas que viram uma só no celular */
.two,.two-wide{display:grid;gap:14px;align-items:start}
.two{grid-template-columns:1.25fr 1fr}
.two-wide{grid-template-columns:1.5fr 1fr}
@media (max-width:980px){ .two-wide{grid-template-columns:1fr} }
@media (max-width:860px){ .two{grid-template-columns:1fr} }

/* ---------- craque, treino, transferências ---------- */
.craque{margin-left:5px;font-size:10px;color:var(--placar);letter-spacing:-.5px;vertical-align:1px}
.craque.top{color:#FFD36B;text-shadow:0 0 10px rgba(255,176,32,.55)}

.focos{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.foco{
  background:var(--pitch-2);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;font-size:12.5px;color:var(--chalk-dim);text-align:left;transition:.12s;
}
.foco:hover{border-color:var(--chalk-faint);color:var(--chalk)}
.foco[aria-pressed="true"]{background:var(--placar);border-color:var(--placar);color:var(--placar-ink);font-weight:600}

.oferta{
  display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);
}
.oferta:last-child{border-bottom:0}
.oferta-quem{display:flex;align-items:center;gap:10px;min-width:0}
.oferta-quem div{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.oferta-quem b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oferta-quem span{font-size:11.5px;color:var(--chalk-faint)}
.oferta-valor{text-align:right;display:flex;flex-direction:column;line-height:1.25}
.oferta-valor b{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.oferta-valor b.acima{color:var(--win)} .oferta-valor b.abaixo{color:var(--loss)}
.oferta-valor span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-faint)}
.oferta-acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.saidas{padding:9px 14px;border-bottom:1px solid var(--line-soft);display:grid;gap:7px}
.saidas:last-child{border-bottom:0}
.saidas-quem{display:flex;align-items:center;gap:8px;min-width:0}
.saidas-quem .nm{font-size:12.5px}
.saidas-acoes{display:flex;gap:5px;flex-wrap:wrap}
.saidas-acoes .btn[aria-pressed="true"]{background:var(--placar-deep);border-color:var(--placar);color:var(--placar)}

.slot.alvo .dot{border-style:dashed;border-color:rgba(255,176,32,.55)}

@media (max-width:640px){

<script>
"use strict";
/* ============================================================
   BEIRA-CAMPO — motor
   ============================================================ */
const SAVE_KEY = "beiracampo.save.v1";
const PERSON_KEY = "beiracampo.clubes.v1";   // identidade visual: vale para todas as carreiras

const CAMPOS_CLUBE = ["n", "s", "e", "a", "b", "pat", "escudo"];
/* Identidade que vem com o jogo publicado. Duas formas de preencher:
   1) colocar um arquivo escudos.json ao lado do index.html (recomendado — é só
      usar "Baixar escudos.json" no Editor e subir o arquivo);
   2) colar aqui dentro das chaves um pacote exportado pelo Editor.
   Quem abrir o link já vê essa identidade sem precisar subir nada. */
const IDENTIDADE_PADRAO = {};

/* procura escudos.json ao lado do index.html; se não existir, segue sem ele */
function carregarEscudosPadrao() {
  try {
    if (typeof fetch !== "function") return Promise.resolve(false);
    if (!/^https?:$/.test(location.protocol)) return Promise.resolve(false);
  } catch (e) { return Promise.resolve(false); }
  return fetch("escudos.json", { cache: "no-cache" })
    .then(r => (r && r.ok) ? r.json() : null)
    .then(o => {
      if (!o || typeof o !== "object" || Array.isArray(o)) return false;
      let n = 0;
      for (const k in o) {
        if (o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) {
          IDENTIDADE_PADRAO[k] = Object.assign({}, o[k]); n++;
        }
      }
      return n > 0;
    })
    .catch(() => false);
}

function lerLocal() {
  try { const raw = localStorage.getItem(PERSON_KEY); return raw ? (JSON.parse(raw) || {}) : {}; } catch (e) { return {}; }
}
function lerPersonalizacao() {
  const local = lerLocal(), out = {};
  for (const k in IDENTIDADE_PADRAO) out[k] = Object.assign({}, IDENTIDADE_PADRAO[k]);
  for (const k in local) out[k] = Object.assign(out[k] || {}, local[k]);
  return out;
}
function salvarPersonalizacao(obj) {
  try { localStorage.setItem(PERSON_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }
}
function registrarPersonalizacao(id, campo, valor) {
  const p = lerLocal();
  p[id] = p[id] || {};
  if (valor == null) delete p[id][campo]; else p[id][campo] = valor;
  if (!Object.keys(p[id]).length) delete p[id];
  return salvarPersonalizacao(p);
}
function aplicarPersonalizacao(clubs) {
  const p = lerPersonalizacao();
  clubs.forEach(c => {
    const e = p[c.id]; if (!e) return;
    CAMPOS_CLUBE.forEach(k => { if (e[k] != null) c[k] = e[k]; });
  });
  return clubs;
}
/* aplica a identidade nas listas base, para a tela de escolha de clube já mostrar os escudos */
function aplicarIdentidadeBase() {
  try {
    const p = lerPersonalizacao();
    CLUBS.concat(CLUBES_B).forEach((c, i) => {
      const e = p[i]; if (!e) return;
      CAMPOS_CLUBE.forEach(k => { if (e[k] != null) c[k] = e[k]; });
    });
  } catch (e) { console.warn("Beira-Campo: identidade base não aplicada.", e); }
}
/* captura a identidade dos clubes da carreira atual para valer nas próximas */
function guardarIdentidadeAtual() {
  const p = lerLocal();
  let n = 0;
  S.clubs.forEach((c, i) => {
    const base = i < CLUBS.length ? CLUBS[i] : CLUBES_B[i - CLUBS.length];
    if (!base) return;
    const dif = {};
    CAMPOS_CLUBE.forEach(k => { if (c[k] != null && c[k] !== base[k]) dif[k] = c[k]; });
    if (Object.keys(dif).length) { p[i] = Object.assign(p[i] || {}, dif); n++; }
  });
  return { ok: salvarPersonalizacao(p), n };
}
function limparPersonalizacao() { try { localStorage.removeItem(PERSON_KEY); return true; } catch (e) { return false; } }
function exportarIdentidade() { return JSON.stringify(lerPersonalizacao()); }
function importarIdentidade(txt) {
  let o = null;
  try { o = JSON.parse(txt); } catch (e) { return { ok: false, m: "Esse texto não é um pacote válido." }; }
  if (!o || typeof o !== "object" || Array.isArray(o)) return { ok: false, m: "Esse pacote não tem o formato esperado." };
  if (!salvarPersonalizacao(o)) return { ok: false, m: "O navegador recusou guardar (memória cheia)." };
  return { ok: true, m: Object.keys(o).length + " clube(s) aplicados. Vale para todas as carreiras." };
}
const R = (a, b) => a + Math.random() * (b - a);
const Ri = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);

function brl(v, compact) {
  const n = Math.round(v);
  if (compact) {
    if (Math.abs(n) >= 1e6) return "R$ " + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1).replace(".", ",") + " mi";
    if (Math.abs(n) >= 1e3) return "R$ " + Math.round(n / 1e3) + " mil";
  }
  return "R$ " + n.toLocaleString("pt-BR");
}

/* ---------- clubes ---------- */

/* ============================================================
   geração
   ============================================================ */
function makePlayer(pos, rep, forced) {
  const idade = forced && forced.idade ? forced.idade : Ri(17, 36);
  const peak = idade < 22 ? -6 + (idade - 17) * 1.4 : idade > 30 ? -(idade - 30) * 1.6 : 2;
  const base = clamp(48 + rep * 4 + R(-7, 8) + peak, 30, 92);
  const p = { id: 0, nome: playerName(), pos, idade };
  for (const k of ATT_KEYS) p[k] = Math.round(clamp(base + R(-13, 13), 26, 94));
  // reforça atributos-chave da posição
  const w = OVR_W[pos];
  for (const k in w) if (w[k] > .2) p[k] = Math.round(clamp(p[k] + R(3, 12), 30, 96));
  if (pos === "GOL") { p.gol = Math.round(clamp(base + R(-4, 12), 32, 95)); ["vel","fin","dri","des"].forEach(k => p[k] = Ri(18, 42)); }
  else p.gol = Ri(8, 24);
  p.ovr = ovrOf(p);
  p.pot = clamp(p.ovr + (idade < 23 ? Ri(4, 18) : idade < 27 ? Ri(0, 6) : 0), p.ovr, 96);
  // craque: decide jogo além do que os números mostram
  const sorte = Math.random();
  p.talento = (p.ovr >= 71 && sorte < .028 + rep * .011) ? 2
            : (p.ovr >= 62 && sorte < .095 + rep * .026) ? 1 : 0;
  p.moral = Ri(52, 78);
  p.cond = Ri(84, 100);
  p.lesao = 0; p.amarelos = 0; p.susp = 0;
  p.j = 0; p.g = 0; p.a = 0; p.ca = 0; p.cv = 0; p.notaSoma = 0;
  p.contrato = Ri(2, 5);
  p.valor = valorDe(p);
  p.salario = Math.round(p.valor * .012 / 1000) * 1000;
  return p;
}
function valorDe(p) {
  const am = p.idade <= 21 ? 1.2 : p.idade <= 28 ? 1 : p.idade <= 31 ? .7 : .38;
  const tm = [1, 1.35, 1.8][p.talento || 0];
  return Math.round(Math.pow(p.ovr / 10, 5) * 1000 * am * tm / 1000) * 1000;
}
function makeSquad(rep) {
  const plan = [["GOL",3],["ZAG",4],["LAT",4],["VOL",4],["MEI",4],["PON",3],["ATA",3]];
  const out = [];
  for (const [pos, n] of plan) for (let i = 0; i < n; i++) out.push(makePlayer(pos, rep));
  return out;
}

/* ---------- calendário (round-robin) ---------- */
function makeFixtures(n) {
  const ids = [...Array(n).keys()];
  const rounds = [];
  const arr = ids.slice();
  for (let r = 0; r < n - 1; r++) {
    const games = [];
    for (let i = 0; i < n / 2; i++) {
      const h = arr[i], a = arr[n - 1 - i];
      games.push(r % 2 === 0 ? [h, a] : [a, h]);
    }
    rounds.push(games);
    arr.splice(1, 0, arr.pop());
  }
  const turno2 = rounds.map(g => g.map(([h, a]) => [a, h]));
  // embaralha a ordem das rodadas dentro de cada turno
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const order = shuffle([...Array(n - 1).keys()]);
  const t1 = order.map(i => rounds[i]);
  const t2 = order.map(i => turno2[i]);
  return t1.concat(t2).flatMap((games, i) => games.map(([h, a]) => ({ r: i + 1, h, a })));
}

function orcamentoBase(rep, div) {
  const b = rep === 5 ? 88e6 : rep === 4 ? 52e6 : rep === 3 ? 27e6 : rep === 2 ? 14e6 : 8e6;
  return div === 2 ? b * .55 : b;
}
function gerarCalendario() {
  S.fixtures = [];
  for (const div of [1, 2]) {
    const ids = S.clubs.filter(c => c.div === div).map(c => c.id);
    const rodadas = makeFixtures(20);
    for (const fx of rodadas) {
      S.fixtures.push({ r: fx.r, div, h: ids[fx.h], a: ids[fx.a], gh: null, ga: null });
    }
  }
}
function metaDe(rep, div) {
  if (div === 2) {
    if (rep >= 3) return { txt: "Conseguir o acesso à Série A", pos: 4, tol: 3 };
    if (rep === 2) return { txt: "Brigar pelo G4 até o fim", pos: 8, tol: 4 };
    return { txt: "Ficar longe do rebaixamento", pos: 16, tol: 2 };
  }

  if (rep === 4) return { txt: "Vaga na Libertadores (G4)", pos: 4, tol: 4 };

}
const minhaDiv = () => S.clubs[S.me].div;
const me = () => S.clubs[S.me];
const squadOf = ci => S.players.filter(p => p.clube === ci);
const byId = id => S.players.find(p => p.id === id);
function msg(de, txt, hi) { S.inbox.unshift({ de, txt, r: S.rodada, hi: !!hi }); if (S.inbox.length > 60) S.inbox.pop(); }

/* ---------- escalação ---------- */
function disponiveis(ci) { return squadOf(ci).filter(p => p.lesao === 0 && p.susp === 0); }
function bestXI(ci, formName) {
  const slots = FORMATIONS[formName];
  const pool = disponiveis(ci).slice();
  const out = [];
  slots.forEach((sl, i) => {
    let best = null, bs = -1;
    for (const p of pool) {
      const sc = p.ovr * Math.pow(AFF[p.pos][sl[0]], 2.2) * (.55 + p.cond / 220) * (1 + (p.talento || 0) * .05);
      if (sc > bs) { bs = sc; best = p; }
    }
    if (best) { out[i] = best.id; pool.splice(pool.indexOf(best), 1); }
    else out[i] = null;
  });
  return { xi: out, resto: pool };
}
function autoEscalar() {
  const { xi, resto } = bestXI(S.me, S.tatica.form);
  S.xi = xi;
  S.banco = resto.sort((a, b) => b.ovr - a.ovr).slice(0, 9).map(p => p.id);
}
function xiValido() { return S.xi.length === 11 && S.xi.every(id => { const p = id && byId(id); return p && p.lesao === 0 && p.susp === 0; }); }

/* ---------- força ---------- */
function condMult(p) { return .70 + (p.cond / 100) * .30; }
function condMultV(c) { return .70 + (clamp(c, 0, 100) / 100) * .30; }
function moralMult(p) { return .92 + (p.moral / 100) * .16; }
function effOf(p, slotPos, condAtual) {
  const cm = condAtual == null ? condMult(p) : condMultV(condAtual);
  return p.ovr * AFF[p.pos][slotPos] * cm * moralMult(p) * (1 + (p.talento || 0) * .025);
}

function forcaTime(ci, xiIds, tat, casa, condMap) {
  const slots = FORMATIONS[tat.form];
  let att = 0, aw = 0, mid = 0, mw = 0, def = 0, dw = 0, gk = 55;
  slots.forEach((sl, i) => {
    const p = xiIds[i] ? byId(xiIds[i]) : null;
    if (!p) return;
    const e = effOf(p, sl[0], condMap ? condMap[p.id] : null);
    const g = sl[0];
    if (g === "GOL") { gk = e; return; }
    const wa = g === "ATA" ? 1 : g === "PON" ? .92 : g === "MEI" ? .55 : g === "VOL" ? .3 : g === "LAT" ? .27 : .1;
    const wm = g === "MEI" || g === "VOL" ? 1 : g === "PON" ? .45 : g === "LAT" ? .34 : g === "ZAG" ? .16 : .22;
    const wd = g === "ZAG" ? 1 : g === "LAT" ? .9 : g === "VOL" ? .55 : g === "MEI" ? .22 : .07;
    att += e * wa; aw += wa; mid += e * wm; mw += wm; def += e * wd; dw += wd;
  });
  att = aw ? att / aw : 50; mid = mw ? mid / mw : 50; def = dw ? def / dw : 50;
  const mi = MENTAL.findIndex(m => m.k === tat.mental) - 2;      // -2..+2
  const pi = PRESS.findIndex(m => m.k === tat.press) - 1;        // -1..+1
  const ri = RITMO.findIndex(m => m.k === tat.ritmo) - 1;        // -1..+1
  att *= 1 + .085 * mi + .03 * ri;
  def *= 1 - .075 * mi + .05 * pi - .02 * ri;
  mid *= 1 + .06 * pi + .02 * ri;
  if (casa) { att *= 1.055; def *= 1.035; mid *= 1.03; }
  return { att, mid, def, gk, mi, pi, ri };
}
