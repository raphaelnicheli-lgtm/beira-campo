}

/* ============================================================
   estádio
   ============================================================ */
function viewEstadio() {
  const c = me();
  const cap = capacidadeDe(c);
  const casa = S.receitas.filter(r => r.publico > 0).slice(0, 10);
  const medio = casa.length ? Math.round(casa.reduce((a, r) => a + r.publico, 0) / casa.length) : 0;
  const ocup = medio ? Math.round(medio / cap * 100) : 0;
  const rendaMedia = casa.length ? Math.round(casa.reduce((a, r) => a + r.bilheteria, 0) / casa.length) : 0;

  const obraCard = t => {
    const o = OBRAS[t], nivel = c[t] || 0, custo = custoObra(c, t), erro = podeObra(c, t);
    const emAndamento = c.obra && c.obra.tipo === t;
    return `<div class="obra ${emAndamento ? "ativa" : ""}">
      <div class="obra-topo">
        <div><b>${o.n}</b><span>${esc(o.d)}</span></div>
        <div class="niveis">${Array.from({ length: o.max }, (_, i) =>
          `<i class="${i < nivel ? "feito" : ""}"></i>`).join("")}<u>${nivel}/${o.max}</u></div>
      </div>
      ${emAndamento
        ? `<div class="obra-and">
            <span class="tag on">Em obras · entrega na rodada ${c.obra.termina}</span>
            <span class="bar" style="flex:1"><i style="width:${clamp((1 - (c.obra.termina - S.rodada) / o.rodadas) * 100, 4, 100)}%;background:var(--placar)"></i></span>
            <span class="num" style="font-size:12px">${Math.max(0, c.obra.termina - S.rodada)} rodada(s)</span>
          </div>`
        : `<div class="obra-acao">
            <div class="obra-num"><u>Custo</u><b>${brl(custo, true)}</b></div>
            <div class="obra-num"><u>Prazo</u><b>${o.rodadas} rodadas</b></div>
            <div class="obra-num"><u>Ganho</u><b class="ganho">${o.ganho}</b></div>
            <button class="btn primary" data-act="obra" data-t="${t}" ${erro ? "disabled" : ""}>Iniciar obra</button>
          </div>
          ${erro ? `<p class="obra-erro">${esc(erro)}</p>` : ""}`}
    </div>`;
  };

  const rank = S.clubs.slice().sort((a, b) => capacidadeDe(b) - capacidadeDe(a));

  return `<h2 class="vt">${esc(c.e)}</h2>
  <p class="vs">Estádio maior e mais moderno significa mais gente no jogo e ingresso mais caro — é a receita que não depende de vender jogador. Durante a obra o público cai cerca de 15%.</p>

  <div class="two" style="margin-bottom:14px">
    <div class="panel arena">
      <div class="arena-vis" style="--ca:${c.a};--cb:${c.b}">
        <div class="arena-anel"></div><div class="arena-anel dois"></div>
        <div class="arena-campo"></div>
        <div class="arena-lbl">${crest(c, 34)}<b>${cap.toLocaleString("pt-BR")}</b><span>lugares</span></div>
      </div>
      <div class="pb" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px">
        <div class="stat"><u>Público médio</u><b>${medio ? medio.toLocaleString("pt-BR") : "–"}</b>${bar(ocup)}</div>
        <div class="stat"><u>Ocupação</u><b>${ocup}%</b></div>
        <div class="stat"><u>Renda média</u><b style="font-size:15px">${rendaMedia ? brl(rendaMedia, true) : "–"}</b></div>
        <div class="stat"><u>Ingresso médio</u><b style="font-size:15px">${brl(Math.round(precoBase(c)))}</b></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      ${obraCard("amp")}
      ${obraCard("mod")}
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h3>Maiores estádios da Série A</h3><span class="sp"></span><span class="tag">os rivais também investem</span></div>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Clube</th><th>Estádio</th><th class="num">Capacidade</th><th>Ampliações</th><th>Modernizações</th><th>Obra</th></tr></thead>
      <tbody>${rank.map((x, i) => `<tr class="${x.id === S.me ? "me" : ""}">
        <td class="num" style="width:36px">${i + 1}</td>
        <td class="nm"><span class="celclube">${crest(x, 22)}${esc(x.n)}</span></td>
        <td class="nm" style="color:var(--chalk-dim)">${esc(x.e)}</td>
        <td class="num"><b>${capacidadeDe(x).toLocaleString("pt-BR")}</b></td>
        <td>${"▰".repeat(x.amp || 0) || '<span style="color:var(--chalk-faint)">–</span>'}</td>
        <td>${"▰".repeat(x.mod || 0) || '<span style="color:var(--chalk-faint)">–</span>'}</td>
        <td>${x.obra ? `<span class="tag on">${OBRAS[x.obra.tipo].n}</span>` : ""}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

/* ============================================================
   carreira do técnico

function nivelTecnico(r) {
  return r >= 82 ? "Nome consolidado" : r >= 62 ? "Técnico respeitado"
    : r >= 42 ? "Em ascensão" : r >= 22 ? "Ainda provando" : "Desconhecido";
}
function viewCarreira() {
  const t = S.tecnico;
  const h = t.historico;
  const empregos = S.empregos || [];
  const c = me();

  return `<h2 class="vt">Carreira</h2>
  <p class="vs">Sua reputação é o que abre porta. Ela sobe com título, acesso e meta cumprida — e desaba com rebaixamento e demissão.</p>

  <div class="two" style="margin-bottom:14px">
    <div class="panel">
      <div class="repbox">
        <div class="repnum"><b>${Math.round(t.rep)}</b><span>reputação</span></div>
        <div class="repinfo">
          <b>${nivelTecnico(t.rep)}</b>
          <span>${S.desempregado ? "Sem clube no momento." : `Treinando o ${esc(c.n)} · ${divInfo(c.div).n}`}</span>
          <div class="repbar"><i style="width:${t.rep}%"></i></div>
        </div>
      </div>
      <div class="pb" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:16px;border-top:1px solid var(--line-soft)">

        <div class="stat"><u>Títulos</u><b>${t.titulos || 0}</b></div>
        <div class="stat"><u>Acessos</u><b>${t.acessos || 0}</b></div>
        <div class="stat"><u>Clubes</u><b>${new Set(h.map(x => x.clube)).size || 1}</b></div>
      </div>
    </div>

    <div class="panel">
      <div class="ph"><h3>Propostas na mesa</h3><span class="sp"></span>
        <span class="tag ${empregos.length ? "on" : ""}">${empregos.length || "nenhuma"}</span></div>
      ${empregos.length ? empregos.map(e => {
        const cl = S.clubs[e.clube];
        return `<div class="emprego">
          <div class="emprego-quem">${crest(cl, 34)}<div>
            <b>${esc(cl.n)}</b>
            <span>${divInfo(cl.div).n} · ${esc(cl.e)} · caixa ${brl(e.orcamento, true)}</span>
            <span class="emprego-meta">${esc(e.meta.txt)}</span>
          </div></div>
          <div class="emprego-txt">${esc(e.texto)}</div>
          <button class="btn primary sm" data-act="aceitar-emprego" data-id="${e.clube}">Assinar</button>
        </div>`;
      }).join("") : `<div class="empty">${S.desempregado
        ? "Nenhum clube procurou você ainda. Termine a temporada para receber novos convites."
        : "Ninguém bateu na porta. Faça uma boa campanha que os convites aparecem no fim do ano."}</div>`}
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h3>Histórico</h3></div>
    ${h.length ? `<div class="scroll"><table>
      <thead><tr><th>Temp.</th><th>Clube</th><th>Divisão</th><th class="num">Posição</th><th class="num">Pontos</th><th>Desfecho</th><th class="num">Reputação</th></tr></thead>
      <tbody>${h.map(x => `<tr>
        <td class="num">${x.temporada}</td>
        <td class="nm"><span class="celclube">${crest(S.clubs[x.clube], 22)}${esc(S.clubs[x.clube].n)}</span></td>
        <td><span class="tag ${x.div === 1 ? "on" : ""}">${divInfo(x.div).n}</span></td>
        <td class="num"><b>${x.pos}º</b></td>
        <td class="num">${x.pts}</td>
        <td>${x.campeao ? '<span class="tag good">Campeão</span>' : ""}
            ${x.subiu ? '<span class="tag good">Acesso</span>' : ""}
            ${x.caiu ? '<span class="tag bad">Rebaixado</span>' : ""}
            ${x.demitido ? '<span class="tag bad">Demitido</span>' : ""}</td>
        <td class="num">${x.rep}</td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">Sua primeira temporada ainda está em andamento.</div>`}

   estatísticas

function viewStats() {
  const div = UI.statDiv || minhaDiv();
  const naDiv = p => S.clubs[p.clube] && S.clubs[p.clube].div === div;
  const art = S.players.filter(p => p.g > 0 && naDiv(p)).sort((a, b) => b.g - a.g || b.a - a.a).slice(0, 12);
  const ass = S.players.filter(p => p.a > 0 && naDiv(p)).sort((a, b) => b.a - a.a).slice(0, 10);
  const notas = S.players.filter(p => p.j >= 4 && naDiv(p)).sort((a, b) => b.notaSoma / b.j - a.notaSoma / a.j).slice(0, 10);
  const maxG = art.length ? art[0].g : 1;
  const linha = (p, v, max, sufixo) => `<div class="row" style="gap:9px;padding:5px 0">
    <span class="nm" style="width:120px;font-size:12.5px">${esc(p.nome)}</span>
    ${S.clubs[p.clube] ? crest(S.clubs[p.clube], 20) : '<span style="width:20px"></span>'}
    <span style="flex:1;min-width:60px">${bar(v / max * 100, p.clube === S.me ? "var(--placar)" : "var(--chalk-faint)")}</span>
    <span class="num" style="width:34px">${v}${sufixo || ""}</span></div>`;

  return `<h2 class="vt">Estatísticas</h2>
  <p class="vs">Números da ${divInfo(div).n}. Seus jogadores aparecem destacados.</p>
  <span class="seg" style="margin-bottom:14px">${[1, 2].map(d => `<button data-act="statdiv" data-k="${d}" aria-pressed="${div === d}">${divInfo(d).n}</button>`).join("")}</span>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
    <div class="panel"><div class="ph"><h3>Artilharia</h3></div><div class="pb">
      ${art.length ? art.map(p => linha(p, p.g, maxG)).join("") : `<div class="empty">Nenhum gol marcado ainda.</div>`}</div></div>
    <div class="panel"><div class="ph"><h3>Assistências</h3></div><div class="pb">
      ${ass.length ? ass.map(p => linha(p, p.a, ass[0].a)).join("") : `<div class="empty">Sem assistências.</div>`}</div></div>
    <div class="panel"><div class="ph"><h3>Melhores notas <span style="color:var(--chalk-faint);letter-spacing:0;text-transform:none">(mín. 4 jogos)</span></h3></div><div class="pb">
      ${notas.length ? notas.map(p => linha(p, (p.notaSoma / p.j).toFixed(1), 10)).join("") : `<div class="empty">Poucos jogos disputados.</div>`}</div></div>
  </div>`;
}

/* ============================================================
   partida — controle de tempo
   ============================================================ */
const VELOCIDADES = { 1: 300, 3: 110, 6: 45 };
function tick() {
  const st = UI.partida; if (!st) { pararTimer(); return; }
  const novos = st.step();
  if (st.pausa || st.intervalo || st.fim) { pararTimer(); render(); return; }
  patchPartida(novos);
}
function iniciarTimer() {
  pararTimer();
  const st = UI.partida;
  if (!st || st.fim || st.pausa || st.intervalo) return;
  UI.timer = setInterval(tick, VELOCIDADES[UI.vel] || 300);
}
function pararTimer() { if (UI.timer) clearInterval(UI.timer); UI.timer = null; }

/* atualiza só o que muda a cada minuto — mantém o scroll e deixa a animação rodar */
function patchPartida(novos) {
  const st = UI.partida; if (!st || VIEW !== "partida") return;
  const q = i => document.getElementById(i);
  const sc = q("pl-score"), cl = q("pl-clock"), pr = q("pl-prog");
  if (!sc) { render(); return; }
  sc.textContent = st.gh + " · " + st.ga;
  cl.textContent = st.label(st.min);
  pr.style.width = (st.min / st.total * 100) + "%";
  const n = q("narr");
  if (n && novos && novos.length) {
    if (n.querySelector(".empty")) n.innerHTML = "";
    for (const e of novos) n.insertAdjacentHTML("afterbegin", evHTML(e));
    while (n.children.length > 90) n.removeChild(n.lastElementChild);
  }
  const s = q("pl-stats"); if (s) s.innerHTML = statsHTML(st);
  const c = q("pl-campo"); if (c) c.innerHTML = campoHTML(st);
  if (novos && novos.some(e => e.cls === "gol")) mostrarGol(st);
}
function mostrarGol(st) {
  const el = document.getElementById("pl-gol"); if (!el || !st.ultimoGol) return;
  const g = st.ultimoGol;
  el.className = "golband " + (g.ci === S.me ? "meu" : "contra");
  el.innerHTML = `<b>GOL${g.ci === S.me ? "!" : " do adversário"}</b><span>${esc(g.nome)} · ${st.label(g.min)}</span><span class="pl">${esc(g.placar)}</span>`;
  el.hidden = false;
  clearTimeout(UI.golTimer);
  UI.golTimer = setTimeout(() => { const e2 = document.getElementById("pl-gol"); if (e2) e2.hidden = true; }, 3400);
}

function recomporBanco() {
  S.banco = squadOf(S.me).filter(q => !S.xi.includes(q.id) && q.lesao === 0 && q.susp === 0)
    .sort((a, b) => b.ovr - a.ovr).slice(0, 9).map(q => q.id);
}

function montarPartida() {
  const fx = meuJogo(S.rodada);
  const advId = fx.h === S.me ? fx.a : fx.h;
  const tA = taticaIA(advId);
  const bA = bestXI(advId, tA.form);
  const bancoA = bA.resto.sort((a, b) => b.ovr - a.ovr).slice(0, 9).map(p => p.id);
  const meuBanco = S.banco.filter(id => { const p = byId(id); return p && p.clube === S.me && p.lesao === 0 && p.susp === 0 && !S.xi.includes(id); });
  const st = fx.h === S.me
    ? novaPartida(S.me, advId, S.tatica, tA, S.xi, bA.xi, meuBanco, bancoA)
    : novaPartida(advId, S.me, tA, S.tatica, bA.xi, S.xi, bancoA, meuBanco);
  st.auto[advId] = true;
  st.humano = S.me;
  if (!S.opts) S.opts = { decisoes: true };
  st.decisoes = S.opts.decisoes !== false;
  UI.partida = st;
  return { st, fx };
}

/* ============================================================
   eventos
   ============================================================ */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  try { tratarClique(ev, t); }
  catch (e) {
    console.warn("Beira-Campo (ação):", e);
    try { repararEstado(); } catch (e2) {}
    UI.flash = null;
    render();
  }
});

function tratarClique(ev, t) {
  const act = t.dataset.act;
  const idBruto = t.dataset.id;
  const id = idBruto == null || idBruto === "" ? null : Number(idBruto);
  if (idBruto != null && idBruto !== "" && Number.isNaN(id)) throw new Error("Identificador inválido no botão: " + idBruto);

  switch (act) {
    case "voltar-inicio": {
      VIEW = "hub"; UI.modal = null; UI.flash = null; UI.confirma = null; UI.partida = null;
      render(); return;
    }
    case "err-zerar": {
      try { apagarSave(); } catch (e2) {}
      S = null; UI.partida = null; escolhido = null;
      try { location.reload(); } catch (e2) { root().innerHTML = viewStart(); }
      return;
    }
    case "pick": escolhido = +t.dataset.i; render(); return;
    case "comecar": if (escolhido === null) return; newGame(escolhido); VIEW = "hub"; save(); render(); return;
    case "continuar": {
      let carregado = null;
      try { carregado = load(); } catch (e) { ultimoErro = e; }
      if (!carregado) { ultimoErro = ultimoErro || new Error("O save existe mas não pôde ser lido."); root().innerHTML = viewStart(); return; }
      S = carregado; VIEW = "hub"; render();
      return;
    }
    case "reiniciar":
      UI.confirma = { acao: "reiniciar", titulo: "Começar um novo jogo",
        texto: "Isso apaga a temporada salva neste navegador e volta para a escolha de clube. Não dá pra desfazer.",
        rotulo: "Apagar e recomeçar" };
      render(); return;
    case "salvar": save(); UI.flash = "Temporada salva neste navegador."; render(); return;
    case "backup": UI.modal = "backup"; render(); return;
    case "pacote": UI.modal = "pacote"; render(); return;
    case "baixar-pacote": {
      try {
        const blob = new Blob([exportarIdentidade()], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "escudos.json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 3000);
        UI.flash = "escudos.json baixado. Suba esse arquivo junto com o index.html.";
      } catch (e) {
        UI.flash = "O navegador bloqueou o download — copie o texto da caixa acima.";
      }
      render(); return;
    }
    case "importar-pacote": {
      const ta = document.getElementById("pac-entrada");
      const r = importarIdentidade(ta ? ta.value.trim() : "");
      if (r.ok) {
        const p = lerPersonalizacao();
        S.clubs.forEach(c => { const e = p[c.id]; if (e) CAMPOS_CLUBE.forEach(k => { if (e[k] != null) c[k] = e[k]; }); });
        aplicarIdentidadeBase();
        UI.modal = null; save();
      }
      UI.flash = r.m; render(); return;
    }
    case "voltar-ponto": {
      const pts = lerPontos();
      const pt = pts.find(x => x.i === +t.dataset.k);
      if (!pt) { UI.flash = "Esse ponto de retorno não está mais disponível."; render(); return; }
      try { localStorage.setItem(SAVE_KEY, pt.raw); } catch (e) { UI.flash = "Não consegui gravar esse ponto."; render(); return; }
      S = load();
      try { repararEstado(); } catch (e) {}
      UI.modal = null; VIEW = "hub";
      UI.flash = "Voltou para a temporada " + pt.temporada + " com o " + pt.clube + ".";
      save(); render(); return;
    }
    case "restaurar": {
      const ta = document.getElementById("bk-entrada");
      const txt = ta ? ta.value.trim() : "";
      if (!txt) { UI.flash = "Cole o texto do backup antes de restaurar."; render(); return; }
      let obj = null;
      try { obj = JSON.parse(txt); } catch (e) { UI.flash = "Esse texto não é um backup válido."; render(); return; }
      if (!obj || !obj.clubs || !obj.players) { UI.flash = "Esse backup não tem os dados de uma carreira."; render(); return; }
      try { localStorage.setItem(SAVE_KEY, txt); } catch (e) { UI.flash = "O navegador recusou salvar (backup grande demais)."; render(); return; }
      S = load();
      try { repararEstado(); } catch (e) {}
      UI.modal = null; VIEW = "hub";
      UI.flash = "Carreira restaurada: " + (S.clubs[S.me] ? S.clubs[S.me].n : "") + ", temporada " + S.temporada + ".";
      save(); render(); return;
    }
    case "scrim": if (ev.target !== t) return; // clique dentro do modal não fecha
    case "fecharModal":
      UI.modal = null; UI.flash = null; UI.sai = null; UI.entra = null; UI.confirma = null;
      render();
      if (VIEW === "partida" && UI.partida && !UI.partida.fim && !UI.partida.pausa && !UI.partida.intervalo) iniciarTimer();
      return;

    case "nav":
      if (VIEW === "partida" && t.dataset.v !== "partida") pararTimer();
      VIEW = t.dataset.v; UI.slot = null; render(); return;

    case "ordem": UI.ordem = t.dataset.k; render(); return;
    case "ficha": UI.modal = fichaModal(id); render(); return;

    /* escalação */
    case "form": S.tatica.form = t.dataset.k; autoEscalar(); UI.slot = null; save(); render(); return;
    case "auto": autoEscalar(); UI.slot = null; save(); render(); return;
    case "slot": {
      const i = +t.dataset.i;
      if (UI.slot === null) { UI.slot = i; render(); return; }
      if (UI.slot === i) { UI.slot = null; render(); return; }
      const a = S.xi[UI.slot] || null, b = S.xi[i] || null;   // troca os dois de lugar
      S.xi[UI.slot] = b; S.xi[i] = a;
      UI.slot = null; save(); render(); return;
    }
    case "escolher": {
      const p = byId(id);
      if (!p || p.lesao > 0 || p.susp > 0) { UI.flash = "Jogador indisponível para esta partida."; render(); return; }
      if (UI.slot === null) { UI.flash = "Escolha antes uma posição no campo."; render(); return; }
      const antigo = S.xi[UI.slot] || null;
      const jaEm = S.xi.indexOf(id); if (jaEm >= 0) S.xi[jaEm] = antigo;
      S.xi[UI.slot] = id;
      recomporBanco();
      UI.slot = null; save(); render(); return;
    }

    /* tática / treino */
    case "tat": S.tatica[t.dataset.campo] = t.dataset.k; save(); render(); return;
    case "foco": { if (!S.treino.grupos) S.treino.grupos = Object.assign({}, TREINO_PADRAO); S.treino.grupos[t.dataset.g] = t.dataset.k; save(); render(); return; }
    case "carga": S.treino.carga = t.dataset.k; save(); render(); return;

    /* partida */
    case "iniciar": montarPartida(); render(); iniciarTimer(); return;
    case "simulardireto": { const { st } = montarPartida(); st.rodarTudo(); pararTimer(); render(); return; }
    case "vel": UI.vel = +t.dataset.v; if (UI.timer) iniciarTimer(); render(); return;
    case "pausar": if (UI.timer) pararTimer(); else iniciarTimer(); render(); return;
    case "ateofim": pararTimer(); UI.partida.rodarTudo(); UI.modal = null; render(); return;
    case "pularint": {
      const st = UI.partida; pararTimer();
      st.autoResolve = true;
      let g = 0; while (!st.intervaloFeito && !st.fim && g++ < 200) st.step();
      st.autoResolve = false;
      if (!st.fim) st.intervalo = true;
      render(); return;
    }
    case "tatlive": {
      UI.partida.ajustar(S.me, t.dataset.campo, t.dataset.k);
      S.tatica[t.dataset.campo] = t.dataset.k;
      render(); if (!UI.partida.intervalo && !UI.partida.pausa && !UI.partida.fim) iniciarTimer();
      return;
    }
    case "toggledec": {
      const st = UI.partida;
      st.decisoes = !st.decisoes;
      if (!S.opts) S.opts = {};
      S.opts.decisoes = st.decisoes;
      save(); render(); return;
    }
    case "discurso": UI.partida.discurso(t.dataset.k); render(); return;
    case "voltarst": UI.partida.voltarSegundoTempo(); render(); iniciarTimer(); return;

    /* decisões no meio do jogo */
    case "bater": UI.partida.cobrarPenalti(id); render(); iniciarTimer(); return;
    case "dec-amarelo": {
      const st = UI.partida;
      if (t.dataset.k === "sair") { UI.sai = st.pausa.id; UI.entra = null; UI.modal = "sub-amarelo"; render(); return; }
      st.decidirAmarelo(t.dataset.k); render(); iniciarTimer(); return;
    }
    case "dec-lesao": {
      const erro = UI.partida.decidirLesao(t.dataset.k, null);
      if (erro) UI.flash = erro;
      render(); if (!UI.partida.pausa) iniciarTimer(); return;
    }
    case "dec-lesao-sub": {
      const erro = UI.partida.decidirLesao("sair", id);
      if (erro) UI.flash = erro;
      render(); if (!UI.partida.pausa) iniciarTimer(); return;
    }

    case "modalsub": pararTimer(); UI.modal = "sub"; render(); return;
    case "sai": UI.sai = id; render(); return;
    case "entra": UI.entra = id; render(); return;
    case "confirmarsub": {
      const st = UI.partida;
      const erro = st.pausa && st.pausa.tipo === "amarelo"
        ? st.decidirAmarelo("sair", UI.entra)
        : st.sub(S.me, UI.sai, UI.entra);
      UI.sai = null; UI.entra = null;
      if (erro) UI.flash = erro; else UI.modal = null;
      render();
      if (!UI.modal && !st.fim && !st.pausa && !st.intervalo) iniciarTimer();
      return;
    }
    case "encerrar": {
      const fx = meuJogo(S.rodada);
      fecharRodada(UI.partida, fx);
      UI.partida = null; pararTimer();
      // reescala se alguém saiu de campo por lesão/suspensão
      if (!xiValido()) autoEscalar();
      recomporBanco();
      VIEW = S.fim ? "partida" : "hub"; save(); render(); return;
    }
    case "novatemp": {
      if (UI.virando) return;              // clique repetido não avança o ano duas vezes
      UI.virando = true;
      try { novaTemporada(); VIEW = "hub"; } finally { setTimeout(() => { UI.virando = false; }, 1200); }
      render(); return;
    }

    /* transferências */
    case "comprar": {
      const entry = S.mercado.find(m => m.id === id); if (!entry) return;
      const r = contratar(entry);
      UI.flash = r.m;
      if (r.ok) recomporBanco();
      save(); render(); return;
    }
    case "listar": {
      S.listados = S.listados.includes(id) ? S.listados.filter(x => x !== id) : S.listados.concat(id);
      if (UI.modal) UI.modal = fichaModal(id);
      save(); render(); return;
    }
    case "aceitar": {
      const o = (S.ofertas || []).find(x => x.id === id); if (!o) return;
      const r = vender(o.id, o.valor, o.clube);
      if (r.ok) S.ofertas = S.ofertas.filter(x => x.id !== id);
      UI.flash = r.m;
      if (!xiValido()) autoEscalar();
      recomporBanco(); save(); render(); return;
    }
    case "recusar": {
      const o = (S.ofertas || []).find(x => x.id === id); if (!o) return;
      const p = byId(o.id);
      S.ofertas = S.ofertas.filter(x => x.id !== id);
      msg("Transferências", `Proposta do ${S.clubs[o.clube].n} por ${p ? p.nome : "jogador"} recusada.`);
      save(); render(); return;
    }
    case "pedirmais": { const r = pedirMais(id); UI.flash = r.m; save(); render(); return; }
    case "vender-ja": {
      const p = byId(id); if (!p) return;
      UI.confirma = { acao: "vender-ja", id, titulo: `Vender ${p.nome} agora`,
        texto: `Você recebe ${brl(precoVendaRapida(p), true)} na hora — abaixo dos ${brl(p.valor, true)} que ele vale. Ele sai do elenco imediatamente.`,
        rotulo: `Vender por ${brl(precoVendaRapida(p), true)}` };
      render(); return;
    }
    case "rescindir": {
      const p = byId(id); if (!p) return;
      UI.confirma = { acao: "rescindir", id, titulo: `Rescindir com ${p.nome}`,
        texto: `Você paga ${brl(multaRescisao(p), true)} de multa e não recebe nada por ele. Serve para abrir vaga no elenco (hoje ${squadOf(S.me).length}/30).`,
        rotulo: `Pagar multa e liberar` };
      render(); return;
    }
    case "confirma-sim": {
      const k = UI.confirma; if (!k) return;
      UI.confirma = null; UI.modal = null;
      const r = ACOES_CONFIRMA[k.acao](k.id);
      if (k.acao === "reiniciar") { render(); return; }
      UI.flash = r.m;
      if (!xiValido()) autoEscalar();
      recomporBanco(); save(); render(); return;
    }
    case "tabdiv": UI.tabDiv = +t.dataset.k; render(); return;
    case "statdiv": UI.statDiv = +t.dataset.k; render(); return;
    case "edit-aba": UI.editAba = t.dataset.k; render(); return;
    case "guardar-identidade": {
      const r = guardarIdentidadeAtual();
      UI.flash = r.ok
        ? (r.n ? r.n + " clube(s) guardados. Eles vão aparecer assim em qualquer carreira nova." : "Nenhum clube foi editado nesta carreira ainda.")
        : "O navegador recusou guardar (memória cheia). Tente com menos escudos ou imagens menores.";
      render(); return;
    }
    case "limpar-identidade": {
      UI.confirma = { acao: "limpar-identidade", titulo: "Voltar todos os clubes ao padrão",
        texto: "Isso apaga os escudos que você subiu e os nomes e cores que mudou, em todas as carreiras. A carreira atual em si não é apagada.",
        rotulo: "Voltar ao padrão" };
      render(); return;
    }
    case "edit-div": UI.editDiv = +t.dataset.k; render(); return;
    case "aceitar-emprego": {
      const r = aceitarEmprego(id);
      if (!r.ok) { UI.flash = r.m; render(); return; }
      S.fim = false; S.desfecho = null; S.campeao = null; S.demitido = false;
      if (S.rodada > 38) novaTemporada();
      UI.flash = r.m; VIEW = "hub"; save(); render(); return;
    }
    case "escudo-limpar": { delete S.clubs[id].escudo; registrarPersonalizacao(id, "escudo", null); save(); render(); return; }
    case "colar-nomes": {
      const ta = document.getElementById("colar-nomes"); if (!ta) return;
      const nomes = ta.value.split("\n").map(x => x.trim());
      const sq = squadOf(S.me).slice().sort((a, b) => POSES.indexOf(a.pos) - POSES.indexOf(b.pos) || b.ovr - a.ovr);
      let n = 0;
      nomes.forEach((nome, i) => { if (nome && sq[i]) { sq[i].nome = nome.slice(0, 24); n++; } });
      UI.flash = n ? `${n} nome(s) aplicado(s) ao elenco.` : "Nenhum nome válido na lista.";
      save(); render(); return;
    }
    case "renovar": {
      const r = renovar(id, t.dataset.k);
      UI.flash = r.m; save(); render(); return;
    }
    case "nao-renovar": { const r = naoRenovar(id); UI.flash = r.m; save(); render(); return; }
    case "conversar": { const r = conversar(id, t.dataset.k); UI.modal = null; UI.flash = r.m; save(); render(); return; }
    case "sondar": { const r = sondar(id); UI.modal = null; UI.flash = r.m; save(); render(); return; }
    case "elogio-publico": { const r = elogioPublico(id); UI.flash = r.m; save(); render(); return; }
    case "obra": {
      const r = iniciarObra(S.me, t.dataset.t);
      UI.flash = r.m; save(); render(); return;
    }
  }
}

/* edição de textos, cores e escudos */
document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-act]"); if (!el || !S) return;
  const act = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null;
  if (act === "edit-clube") {
    const c = S.clubs[id]; if (!c) return;
    let v = el.value;
    if (el.dataset.campo === "s") v = v.toUpperCase().slice(0, 4);
    if (!v.trim()) { el.value = c[el.dataset.campo]; return; }
    c[el.dataset.campo] = v;
    registrarPersonalizacao(id, el.dataset.campo, v);
    save(); render();
  } else if (act === "edit-jogador") {
    const p = byId(id); if (!p) return;
    const v = el.value.trim();
    if (!v) { el.value = p.nome; return; }
    p.nome = v.slice(0, 24); save();
  } else if (act === "escudos-lote") {
    const arqs = [...(el.files || [])];
    el.value = "";
    if (!arqs.length) return;
    const norm = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
    const achaClube = nome => {
      const base = norm(nome.replace(/\.[^.]+$/, ""));
      if (!base) return null;
      let c = S.clubs.find(x => norm(x.s) === base);
      if (!c) c = S.clubs.find(x => norm(x.n) === base);
      if (!c) c = S.clubs.find(x => norm(x.n).includes(base) || base.includes(norm(x.n)));
      if (!c) c = S.clubs.find(x => base.includes(norm(x.s)) && norm(x.s).length >= 3);
      return c || null;
    };
    const reduzir = arq => new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            const cv = document.createElement("canvas");
            cv.width = cv.height = 80;
            const cx = cv.getContext("2d");
            const k = Math.min(80 / img.width, 80 / img.height);
            const w = img.width * k, h = img.height * k;
            cx.drawImage(img, (80 - w) / 2, (80 - h) / 2, w, h);
            res(cv.toDataURL("image/webp", .85));
          } catch (e) { res(null); }
        };
        img.onerror = () => res(null);
        img.src = fr.result;
      };
      fr.onerror = () => res(null);
      fr.readAsDataURL(arq);
    });
    (async () => {
      const ok = [], semClube = [], falhou = [];
      for (const arq of arqs) {
        if (arq.size > 3.5e6) { falhou.push(arq.name + " (grande demais)"); continue; }
        const c = achaClube(arq.name);
        if (!c) { semClube.push(arq.name); continue; }
        const url = await reduzir(arq);
        if (!url) { falhou.push(arq.name); continue; }
        c.escudo = url;
        if (!registrarPersonalizacao(c.id, "escudo", url)) { falhou.push(arq.name + " (memória cheia)"); continue; }
        ok.push(c.n);
      }
      save();
      const partes = [];
      if (ok.length) partes.push(ok.length + " escudo(s) aplicados: " + ok.slice(0, 6).join(", ") + (ok.length > 6 ? " e outros" : ""));
      if (semClube.length) partes.push("sem clube correspondente: " + semClube.slice(0, 5).join(", ") + (semClube.length > 5 ? " e outros" : ""));
      if (falhou.length) partes.push("não deu para usar: " + falhou.slice(0, 4).join(", "));
      UI.flash = partes.join(". ") + ".";
      render();
    })();
  } else if (act === "escudo-file") {
    const f = el.files && el.files[0]; if (!f) return;
    if (f.size > 3.5e6) { UI.flash = "Imagem grande demais (máximo 3,5 MB)."; render(); return; }
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const cv = document.createElement("canvas");
          cv.width = cv.height = 80;
          const cx = cv.getContext("2d");
          const k = Math.min(80 / img.width, 80 / img.height);
          const w = img.width * k, h = img.height * k;
          cx.drawImage(img, (80 - w) / 2, (80 - h) / 2, w, h);
          const dataUrl = cv.toDataURL("image/webp", .85);
          S.clubs[id].escudo = dataUrl;
          if (!registrarPersonalizacao(id, "escudo", dataUrl)) UI.flash = "Escudo aplicado nesta carreira, mas o navegador recusou guardá-lo para as próximas (memória cheia).";
          save(); render();
        } catch (e) { UI.flash = "Não consegui processar essa imagem."; render(); }
      };
      img.onerror = () => { UI.flash = "Arquivo de imagem inválido."; render(); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  }
});

function start(hot) {
  const salvo = load();
  if (salvo) {
    S = salvo; VIEW = "hub";
    try { repararEstado(); } catch (e) { console.warn("Beira-Campo: reparo inicial falhou.", e); }
    /* a identidade visual (escudos, nomes, cores) vale também para carreiras já em andamento */
    try { aplicarPersonalizacao(S.clubs); } catch (e) { console.warn("Beira-Campo: identidade não aplicada.", e); }
  }
  render();
}
function arrancar() {
  aplicarIdentidadeBase();
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(() => ({ view: VIEW }));
    window.claude.hot.ready ? window.claude.hot.ready(start) : start({});
  } else start({});
}
try { carregarEscudosPadrao().then(arrancar, arrancar); } catch (e) { arrancar(); }
